      '<label class="label">'+esc(t('trailer'))+'</label>'+
      '<input type="file" id="vTrailer" class="hidden" accept="video/mp4,video/webm,video/ogg,video/quicktime,video/x-matroska">'+
      '<button class="btn btn-sm" id="vTrailerBtn">'+esc(t('pickTrailer'))+'</button>'+
      '<div id="vTrailerInfo" class="hint">'+esc(t('trailerLimit'))+': '+fmtTime(trMin)+' – '+fmtTime(trMax)+'</div>'+
      '<div class="hint">'+esc(t('trailerHint'))+'</div></div>'+
    '</div></div>'+
   (lvl>=2?'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:16px">'+
     '<label style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" id="vRepost" checked style="width:16px;height:16px;accent-color:#fff"><span style="font-size:14px">'+esc(t('allowRepost'))+'</span></label>'+
     '<label style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" id="vAge" style="width:16px;height:16px;accent-color:#fff"><span style="font-size:14px">'+esc(t('ageLimit'))+'</span></label></div>'+
    '<div style="margin-top:14px"><label style="display:flex;align-items:center;gap:10px;cursor:pointer">'+
     '<input type="checkbox" id="vSched" style="width:16px;height:16px;accent-color:#fff"><span style="font-size:14px">'+esc(t('scheduled'))+'</span></label>'+
     '<div id="vSchedBox" class="hidden" style="margin-top:10px"><input id="vSchedAt" class="input" type="datetime-local"></div></div>':'')+
   '<button class="btn btn-primary" id="vSend" style="width:100%;margin-top:20px;padding:12px" disabled>'+esc(t('publish'))+'</button></div>';
}
/* ------------------ Обработчики форм создания ------------------ */
function bindCreate(){
  const u=me(); if(!u) return;
  const lvl=level(u), lim=charLimit(u), tab=CREATE.tab;
  if(tab==='post'){
    const ta=$('#pText'),c=$('#pCount'),w=$('#pWarn'),b=$('#pSend'),pol=$('#pPol');
    const up=()=>{ const n=ta.value.length; c.textContent=n+' / '+lim; const o=n>lim;
      c.style.color=o?'#f2858a':'var(--muted)'; w.textContent=o?t('limitHit'):''; w.style.color='#f2858a';
      b.disabled=o||!ta.value.trim(); };
    ta.oninput=up; up();
    pol.onchange=()=>$('#pListWrap').classList.toggle('hidden',pol.value!=='list');
    const sch=$('#pSched'); if(sch) sch.onchange=()=>$('#pSchedBox').classList.toggle('hidden',!sch.checked);
    // прикреплённые снимки
    const pmaxPh=PHOTO_LIMIT(u);
    let photos=[];
    const drawPhotos=()=>{
      const box=$('#pPhotoList'); if(!box) return;
      box.innerHTML=photos.map((p,i)=>'<div style="position:relative">'+
        '<img src="'+p.data+'" style="width:104px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line)" alt="">'+
        '<button type="button" class="btn btn-sm btn-danger js-phrm" data-i="'+i+'" '+
        'style="position:absolute;top:-8px;right:-8px;padding:2px 8px">✕</button></div>').join('');
      $$('.js-phrm',box).forEach(x=> x.onclick=()=>{ photos.splice(+x.dataset.i,1); drawPhotos(); });
      const pb2=$('#pPhotoBtn'); if(pb2) pb2.disabled=photos.length>=pmaxPh;
    };
    const phBtn=$('#pPhotoBtn'), phInp=$('#pPhotoInp');
    if(phBtn){
      phBtn.onclick=()=>phInp.click();
      phInp.onchange=()=>{
        Array.prototype.slice.call(phInp.files||[]).slice(0,pmaxPh-photos.length).forEach(f=>{
          if(!/^image\//.test(f.type)||f.size>10*1024*1024) return;
          const fr=new FileReader();
          fr.onload=()=>{ photos.push({data:fr.result,blob:f}); drawPhotos(); };
          fr.readAsDataURL(f);
        });
        phInp.value='';
      };
      drawPhotos();
    }
    window.__photos=()=>photos;
    // конструктор вариантов опроса
    const pmax=POLL_LIMIT(u);
    let opts=['',''];
    const drawOpts=()=>{
      const box=$('#pPollOpts'); if(!box) return;
      box.innerHTML=opts.map((o,i)=>'<div style="display:flex;gap:8px;margin-bottom:8px">'+
        '<input class="input js-po" data-i="'+i+'" maxlength="90" placeholder="'+esc(t('pollOpt'))+' '+(i+1)+'" value="'+esc(o)+'">'+
        (opts.length>2?'<button type="button" class="btn btn-sm btn-danger js-porm" data-i="'+i+'">✕</button>':'')+'</div>').join('');
      $$('.js-po',box).forEach(x=> x.oninput=()=>{ opts[+x.dataset.i]=x.value; up(); });
      $$('.js-porm',box).forEach(x=> x.onclick=()=>{ opts.splice(+x.dataset.i,1); drawOpts(); up(); });
      const ab=$('#pPollAdd'); if(ab) ab.disabled=opts.length>=pmax;
    };
    const pp=$('#pPoll');
    if(pp){ pp.onchange=()=>{ $('#pPollBox').classList.toggle('hidden',!pp.checked); drawOpts(); up(); };
      $('#pPollAdd').onclick=()=>{ if(opts.length<pmax){ opts.push(''); drawOpts(); } };
      $('#pPollQ').oninput=up;
      drawOpts(); }
    window.__poll=()=>{
      if(!pp||!pp.checked) return null;
      const q=$('#pPollQ').value.trim();
      const list=opts.map(x=>x.trim()).filter(Boolean).slice(0,pmax);
      if(!q||list.length<2) return 'bad';
      const d=parseInt($('#pPollDays').value,10);
      return { question:q, options:list.map(x=>({text:x,votes:[]})),
        until: d>0? Date.now()+d*86400000 : 0, createdAt:Date.now() };
    };
    b.onclick=()=>{
      const txt=ta.value.trim(); if(!txt||txt.length>lim) return;
      const poll = window.__poll? window.__poll() : null;
      if(poll==='bad'){ toast(t('pollNeedTwo')); return; }
      const schOn=sch&&sch.checked&&$('#pSchedAt').value;
      const post={ id:uid('p'),type:'post',author:u.username,text:txt,createdAt:Date.now(),
        likes:[],dislikes:[],views:0,privacy:$('#pPriv').value,commentPolicy:pol.value,
        commentList:($('#pList')?$('#pList').value:'').split(',').map(s=>s.trim()).filter(Boolean),
        allowRepost: $('#pRepost')? $('#pRepost').checked : true,
        ageLimit: $('#pAge')? $('#pAge').checked : false,
        publishAt: schOn? new Date($('#pSchedAt').value).getTime() : 0,
        poll: poll||null, photos:[] };
      const phs=window.__photos? window.__photos():[];
      const jobs=phs.map((p,i)=>{
        const k='ph_'+post.id+'_'+i;
        return mPut(k,p.blob).then(()=>{ post.photos.push({key:k}); });
      });
      Promise.all(jobs).then(()=>{
      DB.posts.unshift(post);
      mentionsIn(txt).forEach(m=>notify(m,'@'+u.username+' '+t('notifMention'),'#/post/'+post.id));
      post.slug=makeSlug(); saveDB(); toast(t('toastPost')); go('?p='+post.slug);
      }).catch(()=>toast(t('storageFail')));
    };
    return;
  }
  /* --------- видео --------- */
  const abMax=AB_LIMIT(u);
  const trMin=lvl>=3?30:60, trMax=lvl>=3?86400:180;
  CREATE.file=null; CREATE.cover=[]; CREATE.trailer=null; CREATE.dur=0; CREATE.res='';
  const ta=$('#vDesc'),c=$('#vCount'),w=$('#vWarn'),b=$('#vSend'),pol=$('#vPol'),ti=$('#vTitle');
  const up=()=>{ const n=ta.value.length; c.textContent=n+' / '+lim; const o=n>lim;
    c.style.color=o?'#f2858a':'var(--muted)'; w.textContent=o?t('limitHit'):''; w.style.color='#f2858a';
    b.disabled=o||!ti.value.trim()||!(CREATE.dur||parseInt($('#vDur').value,10)); };
  ta.oninput=up; ti.oninput=up; up();
  pol.onchange=()=>$('#vListWrap').classList.toggle('hidden',pol.value!=='list');
  const sch=$('#vSched'); if(sch) sch.onchange=()=>$('#vSchedBox').classList.toggle('hidden',!sch.checked);
  // выбор основного файла (кнопка и перетаскивание)
  const drop=$('#vDrop'),fi=$('#vFile'),info=$('#vFileInfo');
  const okVideo=f=>OK_VIDEO.includes(f.type)||/\.(mp4|webm|ogv|ogg|mov|mkv)$/i.test(f.name);
  const takeFile=f=>{
    if(!f) return;
    if(!okVideo(f)){ info.textContent=t('badFormat'); info.style.color='#f2858a'; return; }
    if(f.size>MEDIA.MAX){ info.textContent=t('fileTooBig')+' '+fmtBytes(MEDIA.MAX); info.style.color='#f2858a'; return; }
    CREATE.file=f; info.style.color='#67d67e';
    info.textContent=t('fileReady')+': '+f.name+' · '+fmtBytes(f.size);
    $('#vSrc').value=''; $('#vSrc').disabled=true;
    if(!ti.value.trim()){ ti.value=f.name.replace(/\.[^.]+$/,''); up(); }
    const p=document.createElement('video'); p.preload='metadata';
    p.onloadedmetadata=()=>{
      if(p.duration&&isFinite(p.duration)){ CREATE.dur=Math.round(p.duration); $('#vDur').value=CREATE.dur;
        $('#vDurInfo').textContent=t('autoDetected'); }
      if(p.videoHeight){ CREATE.res=p.videoWidth+'×'+p.videoHeight; }
      URL.revokeObjectURL(p.src);
    };
    p.src=URL.createObjectURL(f);
  };
  // Длительность по внешней ссылке тоже определяется автоматически
  const srcInp=$('#vSrc');
  srcInp.onchange=()=>{
    const url=srcInp.value.trim(); if(!url) return;
    const p=document.createElement('video'); p.preload='metadata';
    p.onloadedmetadata=()=>{ if(p.duration&&isFinite(p.duration)){ CREATE.dur=Math.round(p.duration);
      $('#vDur').value=CREATE.dur; $('#vDurInfo').textContent=t('autoDetected'); }
      if(p.videoHeight) CREATE.res=p.videoWidth+'×'+p.videoHeight; up(); };
    p.onerror=()=>{ $('#vDurInfo').textContent=t('durNeed'); };
    p.src=url;
  };
  drop.onclick=()=>fi.click();
  fi.onchange=()=>takeFile(fi.files&&fi.files[0]);
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop',e=>{ if(e.dataTransfer.files&&e.dataTransfer.files[0]) takeFile(e.dataTransfer.files[0]); });
  // обложки (A/B)
  const cf=$('#vCover'),cl=$('#vCoverList');
  $('#vCoverBtn').onclick=()=>cf.click();
  const drawCovers=()=>{
    cl.innerHTML=CREATE.cover.map((cv,i)=>'<div style="position:relative;width:150px">'+
      '<img src="'+cv.data+'" style="width:150px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)" alt="">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">'+
      '<span class="badge">'+String.fromCharCode(65+i)+'</span>'+
      '<button class="act js-rmcov" data-i="'+i+'" style="padding:2px 8px">✕</button></div>'+
      (abMax>1?'<input class="input js-abtitle" data-i="'+i+'" style="margin-top:6px;padding:6px 9px;font-size:12.5px" '+
        'placeholder="'+esc(t('abTitle'))+'" value="'+esc(cv.title||'')+'">':'')+'</div>').join('');
    $$('.js-rmcov').forEach(x=>x.onclick=()=>{ CREATE.cover.splice(+x.dataset.i,1); drawCovers(); });
    $$('.js-abtitle').forEach(x=>x.oninput=()=>{ CREATE.cover[+x.dataset.i].title=x.value; });
  };
  cf.onchange=()=>{
    const files=Array.prototype.slice.call(cf.files||[]);
    files.slice(0,abMax-CREATE.cover.length).forEach(f=>{
      if(!/^image\//.test(f.type)||f.size>8*1024*1024) return;
      const fr=new FileReader();
      fr.onload=()=>{ CREATE.cover.push({data:fr.result,blob:f,title:''}); drawCovers(); };
      fr.readAsDataURL(f);
    });
    cf.value='';
  };
  // главы
  const ch=$('#vChap');
  if(ch) ch.oninput=()=>{ const list=parseChapters(ch.value,parseInt($('#vDur').value,10)||0);
    $('#vChapInfo').textContent=list.length+' · '+list.map(x=>fmtTime(x.at)).join(', '); };
  // премьера и трейлер
  const prem=$('#vPrem');
  if(prem) prem.onchange=()=>$('#vPremBox').classList.toggle('hidden',!prem.checked);
  const pmIn=$('#pmIn'),pmAt=$('#pmAt'); let pmMode='in';
  if(pmIn){ pmIn.onclick=()=>{ pmMode='in'; pmIn.classList.add('active'); pmAt.classList.remove('active');
      $('#pmInBox').classList.remove('hidden'); $('#pmAtBox').classList.add('hidden'); };
    pmAt.onclick=()=>{ pmMode='at'; pmAt.classList.add('active'); pmIn.classList.remove('active');
      $('#pmAtBox').classList.remove('hidden'); $('#pmInBox').classList.add('hidden'); }; }
  const tf=$('#vTrailer'),tb=$('#vTrailerBtn'),tinfo=$('#vTrailerInfo');
  if(tb) tb.onclick=()=>tf.click();
  if(tf) tf.onchange=()=>{
    const f=tf.files&&tf.files[0]; if(!f) return;
    if(!okVideo(f)||f.size>MEDIA.MAX){ tinfo.textContent=t('badFormat'); tinfo.style.color='#f2858a'; return; }
    const p=document.createElement('video'); p.preload='metadata';
    p.onloadedmetadata=()=>{
      const d=Math.round(p.duration||0);
      URL.revokeObjectURL(p.src);
      if(d<trMin||d>trMax){                         // жёсткая проверка длительности трейлера по уровню
        CREATE.trailer=null; tinfo.style.color='#f2858a';
        tinfo.textContent=t('trailerBad')+': '+fmtTime(d)+' (‎'+fmtTime(trMin)+' – '+fmtTime(trMax)+')';
        return;
      }
      CREATE.trailer=f; tinfo.style.color='#67d67e';
      tinfo.textContent=t('fileReady')+' · '+fmtTime(d)+' · '+fmtBytes(f.size);
    };
    p.src=URL.createObjectURL(f);
  };
  b.onclick=()=>{
    const title=ti.value.trim(); if(!title){ toast(t('fillTitle')); return; }
    if(ta.value.length>lim) return;
    const dur=Math.min(86400,Math.max(1,parseInt($('#vDur').value,10)||CREATE.dur||0));
    if(!dur){ toast(t('durNeed')); return; }   // без реального файла или ссылки публиковать нечего
    let premiere=false,premiereAt=0;
    if(lvl>=2&&prem&&prem.checked){
      const maxMin=lvl>=3?5256000:1440;
      if(pmMode==='in'){
        let m=parseInt($('#vPremMin').value,10); if(isNaN(m)||m<1) m=1; if(m>maxMin) m=maxMin;
        premiereAt=Date.now()+m*60000;
      } else {
        const raw=$('#vPremAt').value;
        premiereAt=raw?new Date(raw).getTime():Date.now()+60000;
        const cap=Date.now()+maxMin*60000;
        if(!premiereAt||premiereAt<Date.now()+60000) premiereAt=Date.now()+60000;
        if(premiereAt>cap) premiereAt=cap;
      }
      premiere=true;
    }
    const schOn=sch&&sch.checked&&$('#vSchedAt').value;
    const vid={ id:uid('v'),type:'video',author:u.username,title,desc:ta.value,createdAt:Date.now(),
      likes:[],dislikes:[],views:0,durationSec:dur,resolution:CREATE.res,
      privacy:$('#vPriv').value,commentPolicy:pol.value,
      commentList:($('#vList')?$('#vList').value:'').split(',').map(s=>s.trim()).filter(Boolean),
      tags:($('#vTags')?$('#vTags').value:'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,12),
      category:$('#vCat').value, premiere, premiereAt,
      chapters: ch? parseChapters(ch.value,dur):[],
      allowRepost: $('#vRepost')?$('#vRepost').checked:true,
      ageLimit: $('#vAge')?$('#vAge').checked:false,
      publishAt: schOn? new Date($('#vSchedAt').value).getTime():0,
      cover:'', coverKey:'', variants:[], abStats:{},
      fileKey:'', fileName:'', fileSize:0, trailerKey:'', src: CREATE.file?'':$('#vSrc').value.trim() };
    b.disabled=true; b.innerHTML='<span class="spinner"></span> '+esc(t('uploading'));
    const jobs=[];
    if(CREATE.file){ const k='file_'+vid.id;
      jobs.push(mPut(k,CREATE.file).then(()=>{ vid.fileKey=k; vid.fileName=CREATE.file.name; vid.fileSize=CREATE.file.size; })); }
    if(CREATE.trailer){ const k='tr_'+vid.id; jobs.push(mPut(k,CREATE.trailer).then(()=>{ vid.trailerKey=k; })); }
    CREATE.cover.forEach((cv,i)=>{
      const k='cov_'+vid.id+'_'+i;
      jobs.push(mPut(k,cv.blob).then(()=>{
        if(i===0){ vid.coverKey=k; }
        vid.variants.push({ coverKey:k, title:(cv.title||'').trim()||title });
      }));
    });
    Promise.all(jobs).then(()=>{
      vid.variants.sort((a,b2)=>a.coverKey.localeCompare(b2.coverKey));
      if(vid.variants.length<2) vid.variants=[];   // A/B имеет смысл от двух вариантов
      DB.videos.unshift(vid);
      mentionsIn(ta.value).forEach(m=>notify(m,'@'+u.username+' '+t('notifMention'),'#/watch/'+vid.id));
      vid.slug=makeSlug();
      // Уведомляем подписчиков о новом ролике — только их, не самого автора и не о новых подписках
      if(vid.privacy==='public'&&!vid.publishAt){
        DB.users.filter(x=>(x.following||[]).includes(u.username))
          .forEach(x=>notify(x.username,'@'+u.username+' '+t('notifNewVideo')+': '+vid.title,linkOf(vid)));
      }
      saveDB(); toast(t('toastPost')); go('?v='+vid.slug);
    }).catch(()=>{ b.disabled=false; b.textContent=t('publish'); toast(t('storageFail')); });
  };
}

function admSession(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(LS.ADMIN)||'null'); }catch(e){}

}

function bindAdminGate(){
  bindLang();
  const err=$('#agErr');
  const doIn=()=>{
    const fail=x=>{ err.textContent=x; err.classList.remove('hidden'); };
    if(Date.now()<admLock) return fail(t('errAttempts')+' '+Math.ceil((admLock-Date.now())/1000)+' '+t('seconds'));
    const l=$('#agLogin').value.trim(),p=$('#agPass').value;
    const u=DB.users.find(x=>x.username.toLowerCase()===l.toLowerCase());
    if(!u||u.password!==p){ admTries++; if(admTries>=5){ admLock=Date.now()+60000; admTries=0; } return fail(t('errCreds')); }
    if(banInfo(u)) return fail(banMessage(u));
    if(u.role!=='admin') return fail(t('errNotAdmin'));
    admTries=0;
    localStorage.setItem(LS.ADMIN,JSON.stringify({username:u.username,at:Date.now()}));
    if(!SESSION){ SESSION={username:u.username,at:Date.now()}; localStorage.setItem(LS.SESSION,JSON.stringify(SESSION)); }
    logAdmin('logLogin','@'+u.username); saveDB();
    UI.atab='dash'; render();
  };
  $('#agBtn').onclick=doIn;
  $('#agPass').onkeydown=e=>{ if(e.key==='Enter') doIn(); };
  const val=()=>{
    const okL=renderRules($('#mkLR'),loginRules($('#mkLogin').value.trim()));
    const okP=renderRules($('#mkPR'),passRules($('#mkPass').value,'',true));
    const okN=$('#mkName').value.trim().length>=2;
    const okP2=$('#mkPass2').value.length>0&&$('#mkPass').value===$('#mkPass2').value;
    $('#mkBtn').disabled=!(okL&&okP&&okN&&okP2&&$('#mkKey').value.trim());
    return okL&&okP&&okN&&okP2;
  };
  ['mkKey','mkName','mkLogin','mkPass','mkPass2'].forEach(id=>{ $('#'+id).oninput=val; });
  const doReg=()=>{
    const e2=$('#mkErr');
    const fail=x=>{ e2.textContent=x; e2.classList.remove('hidden'); };
    if(Date.now()<keyLock) return fail(t('errAttempts')+' '+Math.ceil((keyLock-Date.now())/1000)+' '+t('seconds'));
    if(!val()) return;
    if(!checkMaster($('#mkKey').value)){        // мастер-ключ сверяется по контрольной сумме
      keyTries++; if(keyTries>=SECURITY.MASTER_ATTEMPTS){ keyLock=Date.now()+SECURITY.MASTER_LOCK_MS; keyTries=0; }
      return fail(t('errKey'));
    }
    DB=loadDB();
    const lg=$('#mkLogin').value.trim();
    if(DB.users.some(u=>u.username.toLowerCase()===lg.toLowerCase())) return fail(t('errTaken'));
    const name=$('#mkName').value.trim();
    DB.users.push({ id:uid('u'),username:lg,password:$('#mkPass').value,name,initials:initialsOf(name),
      color:'#e5e5e5',avatarKey:'',bio:'',region:'EU',role:'admin',isVerified:true,showStaff:false,
      banned:false,bannedUntil:0,banReason:'',following:[],bookmarks:[],notifications:[],createdAt:Date.now() });
    logAdmin('logNewAdmin','@'+lg);
    saveDB();
    localStorage.setItem(LS.ADMIN,JSON.stringify({username:lg,at:Date.now()}));
    SESSION={username:lg,at:Date.now()}; localStorage.setItem(LS.SESSION,JSON.stringify(SESSION));
    keyTries=0; UI.atab='dash'; render(); toast(t('adminCreated'));
  };
  $('#mkBtn').onclick=doReg;
  $('#mkPass2').onkeydown=e=>{ if(e.key==='Enter') doReg(); };
  $('#agT1').onclick=()=>{ $('#agT1').classList.add('active'); $('#agT2').classList.remove('active');
    $('#agF1').classList.remove('hidden'); $('#agF2').classList.add('hidden'); };
  $('#agT2').onclick=()=>{ $('#agT2').classList.add('active'); $('#agT1').classList.remove('active');
    $('#agF2').classList.remove('hidden'); $('#agF1').classList.add('hidden'); val(); };
}

const TERMS=[['1h',3600000],['24h',86400000],['7d',604800000],['30d',2592000000],['perm',0]];
const termLabel=c=>c==='1h'?t('term1h'):c==='24h'?t('term24h'):c==='7d'?t('term7d'):c==='30d'?t('term30d'):t('termPerm');
function openRestrict(kind,key,label){
  openModal('<div class="modal" style="max-width:460px"><div class="modal-head"><div class="modal-title">'+esc(t('aRestrict'))+'</div>'+
   '<button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body">'+

   '<textarea id="rsReason" class="textarea" maxlength="300" style="min-height:80px"></textarea>'+
   '<button class="btn btn-danger" id="rsGo" style="width:100%;margin-top:16px" disabled>'+esc(t('aRestrict'))+'</button></div></div>');
  let code='24h';
  $$('.js-term').forEach(b=> b.onclick=()=>{ code=b.dataset.c; $$('.js-term').forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
  const ta=$('#rsReason'),go2=$('#rsGo');
  ta.oninput=()=>{ go2.disabled=ta.value.trim().length<3; };
  go2.onclick=()=>{
    const reason=ta.value.trim();
    requireConfirm(t('aRestrict')+': '+label+' — '+termLabel(code),()=>{
      const ms=(TERMS.find(x=>x[0]===code)||[])[1]||0;
      const until= code==='perm'?0:Date.now()+ms;
      DB.restrictions.unshift({ id:uid('r'),kind,key,label,reason,term:code,until,
        by:(admSession()||{}).username||'?',at:Date.now(),lifted:false,liftedAt:0,liftedBy:'' });
      const owner = kind==='channel'? key : (findItem(key)||{}).author;
      if(owner) notify(owner,t('notifRestrict')+' '+reason, kind==='channel'?'#/c/'+key:'');
      logAdmin('logRestrict',label+' · '+termLabel(code));
      saveDB(); closeModal(); toast(t('toastSaved')); render();
    });
  };

function unbanUser(username){
  const u=userBy(username); if(!u) return;
  requireConfirm(t('aUnban')+': @'+username,()=>{
    u.banned=false; u.bannedUntil=0; u.banReason='';
    const rec=DB.bans.find(b=>b.user===username&&!b.lifted);
    if(rec){ rec.lifted=true; rec.liftedAt=Date.now(); rec.liftedBy=(admSession()||{}).username||'?'; }
    logAdmin('logUnban','@'+username); saveDB(); toast(t('toastSaved')); render();
  });
}

function bindAdmin(){
  bindLang();
  const c=$('#collapse'); if(c) c.onclick=()=>{ SET.compact=!SET.compact; saveSet(); $('#sidebar').classList.toggle('mini',SET.compact); };
  const b=$('#burger'); if(b) b.onclick=()=>$('#sidebar').classList.toggle('open');
  $$('[data-atab]').forEach(x=> x.onclick=()=>{ UI.atab=x.dataset.atab; ROUTE.q=''; render(); });
  const s=$('#admSearch');
  if(s) s.oninput=e=>{ ROUTE.q=e.target.value; clearTimeout(s._t); s._t=setTimeout(()=>{ render();
    const n=$('#admSearch'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },250); };
  const out=$('#admOut');
  if(out) out.onclick=()=> confirmBox(t('confirmLogoutT'),t('confirmLogoutB'),t('logout'),()=>{
    localStorage.removeItem(LS.ADMIN); confirmedUntil=0; render(); },true);
  $$('.js-mf').forEach(x=> x.onclick=()=>{ UI.modFilter=x.dataset.f; render(); });
  $$('.js-tf').forEach(x=> x.onclick=()=>{ UI.tFilter=x.dataset.f; render(); });
  $$('.js-arestrict').forEach(x=> x.onclick=()=>{ const it=findItem(x.dataset.id);
    openRestrict('item',x.dataset.id,(it.title||String(it.text||'').slice(0,40)||it.id)); });
  $$('.js-chrestrict').forEach(x=> x.onclick=()=>openRestrict('channel',x.dataset.u,'@'+x.dataset.u));
  $$('.js-alift').forEach(x=> x.onclick=()=>liftRestriction(x.dataset.id));
  $$('.js-ban').forEach(x=> x.onclick=()=>openBanUser(x.dataset.u));
  $$('.js-unban').forEach(x=> x.onclick=()=>unbanUser(x.dataset.u));
  $$('.js-aedit').forEach(x=> x.onclick=()=>adminEdit(x.dataset.id));
  $$('.js-adel').forEach(x=> x.onclick=()=>{
    const it=findItem(x.dataset.id); const label=it?(it.title||String(it.text||'').slice(0,40)||it.id):x.dataset.id;
    requireConfirm(t('aDelete')+': '+label,()=>confirmBox(t('confirmDelete'),'',t('aDelete'),()=>{
      removeItem(x.dataset.id); logAdmin('logDel',label); saveDB(); toast(t('toastDeleted')); render(); },true));
  });
  // Делегирование: обработчики живут на контейнере и не теряются после перерисовки
  const view=$('#view')||document.body;
  view.onchange=e=>{
    const sel=e.target.closest && e.target.closest('.js-reg');
    if(!sel) return;
    const u=userBy(sel.dataset.u); if(!u) return;
    u.region=sel.value;
    logAdmin('logRegion','@'+u.username+' → '+regionName(sel.value));
    saveDB(); toast(t('toastSaved'));
  };
  view.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('.js-lvlgo,.js-deluser,.js-ban,.js-unban,.js-chrestrict,.js-alift');
    if(!el||el.disabled) return;
    const cur=admSession(); if(!cur) return;
    const un=el.dataset.u;
    if(el.classList.contains('js-alift')){ liftRestriction(el.dataset.id); return; }
    if(el.classList.contains('js-chrestrict')){ openRestrict('channel',un,'@'+un); return; }
    if(el.classList.contains('js-ban')){ openBanUser(un); return; }
    if(el.classList.contains('js-unban')){ unbanUser(un); return; }
    const u=userBy(un); if(!u) return;
    if(cur.username===u.username){ toast(t('selfWarn')); return; }
    const admins=DB.users.filter(y=>y.role==='admin').length;
    if(el.classList.contains('js-deluser')){
      if(u.role==='admin'&&admins<=1){ toast(t('lastAdmin')); return; }
      requireConfirm(t('aDelete')+': @'+u.username,()=>confirmBox(t('confirmDelete'),'',t('aDelete'),()=>{
        deleteAccount(u.username,true); logAdmin('logDelUser','@'+u.username);
        saveDB(); toast(t('toastDeleted')); render(); },true));
      return;
    }
    // смена уровня доверия
    const sel=view.querySelector('.js-lvl[data-u="'+CSS.escape(un)+'"]');
    if(!sel) return;
    const lvl=parseInt(sel.value,10);
    if(lvl===level(u)) return;
    if(lvl<3&&u.role==='admin'&&admins<=1){ toast(t('lastAdmin')); return; }
    const apply=()=>{
      if(lvl===1){ u.role='user'; u.isVerified=false; u.showStaff=false; }
      if(lvl===2){ u.role='user'; u.isVerified=true; u.showStaff=false; }
      if(lvl===3){ u.role='admin'; u.isVerified=true; }
      notify(u.username,t('notifLevel'),'');
      logAdmin('logLevel','@'+u.username+' → '+lvl);
      saveDB(); toast(t('toastSaved')); render();
    };
    if(lvl===3||u.role==='admin') requireConfirm(t('aLevel')+': @'+u.username+' → '+lvl,apply); else apply();
  });
  $$('.js-rsend').forEach(x=> x.onclick=()=>{
    const ta=document.querySelector('.js-rt[data-id="'+x.dataset.id+'"]');
    const txt=ta.value.trim(); if(!txt) return;
    const tk=DB.tickets.find(y=>y.id===x.dataset.id); if(!tk) return;
    tk.messages.push({from:admSession().username,role:'admin',text:txt,createdAt:Date.now()});
    notify(tk.user,t('notifReply')+': '+txt.slice(0,70),'#/support');
    logAdmin('logReply',tk.id); saveDB(); toast(t('toastSaved')); render();
  });
  $$('.js-appr').forEach(x=> x.onclick=()=>{
    const tk=DB.tickets.find(y=>y.id===x.dataset.id); if(!tk) return;
    const ta=document.querySelector('.js-rt[data-id="'+tk.id+'"]');
    const u=userBy(tk.user);
    if(u&&u.role!=='admin'){ u.isVerified=true; }
    tk.messages.push({from:admSession().username,role:'admin',text:(ta&&ta.value.trim())||t('notifApproved'),createdAt:Date.now()});
    tk.status='approved';

    logAdmin('logApprove','@'+tk.user); saveDB(); toast(t('toastSaved')); render();
  });
  $$('.js-rej').forEach(x=> x.onclick=()=>{
    const tk=DB.tickets.find(y=>y.id===x.dataset.id); if(!tk) return;
    const ta=document.querySelector('.js-rt[data-id="'+tk.id+'"]');
    tk.messages.push({from:admSession().username,role:'admin',text:(ta&&ta.value.trim())||t('notifRejected'),createdAt:Date.now()});
    tk.status='rejected';

    logAdmin('logReject','@'+tk.user); saveDB(); toast(t('toastSaved')); render();

  $$('.js-tclose').forEach(x=> x.onclick=()=>{
    const tk=DB.tickets.find(y=>y.id===x.dataset.id); if(!tk) return;
    tk.status=tk.status==='open'?'closed':'open'; saveDB(); render();

  $$('.avatar[data-av]').forEach(el=>{ mURL(el.dataset.av).then(u=>{ if(u) el.innerHTML='<img src="'+u+'" alt="">'; }); });
}

/* Полное удаление аккаунта со всем следом */
function deleteAccount(un,byAdmin){
  const own=allItems().filter(i=>i.author===un).map(i=>i.id);
  own.forEach(id=>removeItem(id));
  DB.users=DB.users.filter(y=>y.username!==un);
  DB.comments=DB.comments.filter(c2=>c2.author!==un);
  DB.tickets=DB.tickets.filter(y=>y.user!==un);
  DB.views=DB.views.filter(v=>v.who!==un);
  DB.users.forEach(y=>{
    y.following=(y.following||[]).filter(f=>f!==un);
    y.bookmarks=(y.bookmarks||[]).filter(b=>!own.includes(b.id));
  });
  return true;
}

/* ==================================================================
   ТАБЛИЦА ЛИДЕРОВ — прирост подписчиков за период
   ================================================================== */
const LB_PERIODS=[['24h',86400000,'lb24'],['7d',604800000,'lb7'],['30d',2592000000,'lb30'],
  ['180d',15552000000,'lb180'],['365d',31536000000,'lb365'],['all',0,'lbAll']];
function leaderboardPage(){
  const key=ROUTE.arg||'24h';
  const per=LB_PERIODS.find(p=>p[0]===key)||LB_PERIODS[0];
  const since = per[1]? Date.now()-per[1] : 0;
  const rows=DB.users.map(u=>{
    const gained = per[1]
      ? DB.follows.filter(f=>f.to===u.username&&f.at>=since&&(userBy(u.username).following||true)).length
      : followersOf(u.username);
    return { u, gained, total:followersOf(u.username), items:allItems().filter(i=>i.author===u.username&&isLive(i)).length,
      views:viewsOf(u.username) };
  }).filter(r=>r.gained>0||r.total>0||r.items>0)
    .sort((a,b)=> b.gained-a.gained || b.total-a.total || b.views-a.views)
    .slice(0,100);
  /* Цвет места: золото/серебро/бронза для 1-3, потом приглушённый */
  const medal=i=> i===0?'#f5c542':i===1?'#c8ccd4':i===2?'#c1662f':'var(--dim)';
  return pageTitle(t('leaderboard'),t('lbSubs'))+
   '<div style="display:flex;gap:8px;margin-bottom:20px;overflow-x:auto">'+
    LB_PERIODS.map(p=>'<a class="chip'+(key===p[0]?' active':'')+'" href="#/leaders/'+p[0]+'">'+esc(t(p[2]))+'</a>').join('')+'</div>'+
   (rows.length?'<div class="tbl-wrap"><table><thead><tr><th>'+esc(t('lbPlace'))+'</th><th>'+esc(t('colWho'))+'</th>'+
    '<th>'+esc(t('lbSubs'))+'</th><th>'+esc(t('subsCnt'))+'</th><th>'+esc(t('items'))+'</th><th>'+esc(t('views'))+'</th></tr></thead><tbody>'+
    rows.map((r,i)=>{
      const place=i+1;
      /* Для мест 1-99: показываем ник + галочку. Место 100: только цифра. */
      const showBadge = place<=99;
      const nameCell = showBadge
        ? '<a href="#/c/'+esc(r.u.username)+'" style="font-weight:600;display:flex;gap:5px;align-items:center">'+
          esc(r.u.name)+(r.u.isVerified?VER:'')+(r.u.role==='admin'&&r.u.showStaff?STAFF:'')+'</a>'+
          '<div class="mono" style="color:var(--dim);font-size:12.5px">@'+esc(r.u.username)+'</div>'
        : '<a href="#/c/'+esc(r.u.username)+'" style="font-weight:600">'+esc(r.u.name)+'</a>'+
          '<div class="mono" style="color:var(--dim);font-size:12.5px">@'+esc(r.u.username)+'</div>';
      return '<tr><td class="mono" style="font-size:'+(place<=3?'17':'14')+'px;font-weight:800;color:'+medal(i)+';width:60px">'+place+'</td>'+
       '<td><div style="display:flex;gap:10px;align-items:center">'+avatarHTML(r.u,36,false)+
        '<div>'+nameCell+'</div></div></td>'+
       '<td class="mono" style="font-weight:700;color:'+(r.gained>0?'#67d67e':'var(--muted)')+'">'+(per[1]&&r.gained>0?'+':'')+r.gained+'</td>'+
       '<td class="mono">'+r.total+'</td><td class="mono">'+r.items+'</td><td class="mono">'+fmtNum(r.views)+'</td></tr>';
    }).join('')+
    '</tbody></table></div>':'<div class="empty">'+esc(t('lbNo'))+'</div>');
}

   (isV&&lvl>=2?'<div style="margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:15px">'+
     '<label style="display:flex;align-items:center;gap:10px;cursor:pointer">'+
      '<input type="checkbox" id="oePrem"'+(premActive?' checked':'')+' style="width:16px;height:16px;accent-color:#fff">'+
      '<span style="font-weight:700">'+esc(t('premiere'))+'</span></label>'+
     '<div id="oePremBox" class="'+(premActive?'':'hidden')+'" style="margin-top:12px">'+
       '<label class="label">'+esc(t('dateTime'))+'</label>'+
       '<input id="oePremAt" class="input" type="datetime-local" value="'+esc(it.premiereAt?dtLocal(it.premiereAt):'')+'">'+
       '<div class="hint">'+esc(t('premEditHint'))+'</div></div></div>':'')+
   (isV?'<div style="margin-top:16px"><label class="label">'+esc(t('pickCover'))+'</label>'+
     '<input type="file" id="oeCov" accept="image/*" class="hidden">'+
     '<button class="btn btn-sm" id="oeCovB">'+esc(t('pickCover'))+'</button>'+
     '<div id="oeCovI" class="hint"></div></div>':'')+
   (isV&&lvl>=2?
     '<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:16px">'+
     '<label class="label">'+(LANG==='ru'?'Рекомендации в конце видео (до 3)':'End screen recommendations (up to 3)')+'</label>'+
     '<div class="hint" style="margin-bottom:10px">'+(LANG==='ru'?'Ссылки на видео — ID или короткий slug. Показываются зрителям после окончания.':'Video IDs or short slugs shown to viewers after the video ends.')+'</div>'+
     [0,1,2].map(n=>'<input class="input" id="oeRec'+n+'" style="margin-bottom:8px" placeholder="'+(LANG==='ru'?'ID или slug видео':'Video ID or slug')+'" value="'+esc(((it.endRecs||[])[n])||'')+'">').join('')+
     '</div>' : '')+
   '<button class="btn btn-primary" id="oeS" style="width:100%;margin-top:20px;padding:12px">'+esc(t('save'))+'</button>'+
   '</div></div>');
  let cover=null;
  const cb=$('#oeCovB');
  if(cb){ cb.onclick=()=>$('#oeCov').click();
    $('#oeCov').onchange=()=>{ const f=$('#oeCov').files[0]; if(!f||!/^image\//.test(f.type)) return;
      cover=f; $('#oeCovI').textContent=t('fileReady')+' · '+fmtBytes(f.size); $('#oeCovI').style.color='#67d67e'; }; }
  const pc=$('#oePrem');
  if(pc) pc.onchange=()=>$('#oePremBox').classList.toggle('hidden',!pc.checked);
  $('#oeS').onclick=()=>{
    if(isV){ it.title=$('#oeT').value.trim()||it.title; it.desc=$('#oeD').value; }
    else it.text=$('#oeD').value;
    if(!$('#oeP').disabled) it.privacy=$('#oeP').value;
    if(!$('#oeC').disabled) it.commentPolicy=$('#oeC').value;
    const ct=$('#oeCat'); if(ct) it.category=ct.value;
    const tg=$('#oeTags');
    if(tg) it.tags=tg.value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,12);
    it.allowRepost=$('#oeRe').checked;
    it.ageLimit=$('#oeAge').checked;
    const sc=$('#oeSched').value;
    it.publishAt = sc? new Date(sc).getTime() : 0;
    if(pc){
      if(pc.checked){
        const raw=$('#oePremAt').value;
        let at = raw? new Date(raw).getTime() : Date.now()+60000;
        const cap=Date.now()+(lvl>=3?5256000:1440)*60000;
        if(at<Date.now()+60000) at=Date.now()+60000;
        if(at>cap) at=cap;
        it.premiere=true; it.premiereAt=at;
      } else { it.premiere=false; it.premiereAt=0; }
    }
    // Сохраняем рекомендации в конце видео (до 3 ссылок)
    if(isV){
      const recs=[];
      for(let n=0;n<3;n++){
        const el=document.getElementById('oeRec'+n);
        if(el&&el.value.trim()){
          const rv=itemByAny(el.value.trim());
          if(rv&&rv.type==='video') recs.push(rv.id);
        }
      }
      it.endRecs=recs;
    }
    const done=()=>{ saveDB(); closeModal(); toast(t('toastSaved')); render(); };
    if(cover){ const k='cov_'+it.id+'_main_'+Date.now();
      mPut(k,cover).then(()=>{ it.coverKey=k; if(it.variants&&it.variants[0]) it.variants[0].coverKey=k; done(); }).catch(done); }
    else done();
  };
}

/* ==================================================================
   ГЛАВНЫЙ РЕНДЕР
   ================================================================== */
function render(){
  DB=loadDB(); SESSION=loadSession();
  const u0=me();
  if(SESSION&&!u0){ SESSION=null; localStorage.removeItem(LS.SESSION); }
  if(u0&&banInfo(u0)){ const msg=banMessage(u0); saveDB();
    SESSION=null; localStorage.removeItem(LS.SESSION); localStorage.removeItem(LS.ADMIN);
    document.documentElement.lang=LANG;
    $('#root').innerHTML=authScreen(); bindAuth();
    const e=$('#lgErr'); e.textContent=msg; e.classList.remove('hidden'); return; }
  document.documentElement.lang=LANG;
  const R=$('#root'), name=ROUTE.name;
  // --- панель управления
  if(name==='admin'){
    if(!admSession()){ R.innerHTML=adminGate(); bindAdminGate(); return; }
    let inner='';
    if(UI.atab==='content') inner=aContent();
    else if(UI.atab==='channels') inner=aChannels();
    else if(UI.atab==='tickets') inner=aTickets();
    else if(UI.atab==='registry') inner=aRegistry();
    else if(UI.atab==='logs') inner=aLogs();
    else inner=aDash();
    R.innerHTML=adminShell(inner); bindAdmin(); return;
  }
  // --- экран авторизации
  if(name==='auth'){ R.innerHTML=authScreen(); bindAuth(); return; }
  const guest=sessionStorage.getItem('orbit_guest')==='1';
  if(!SESSION&&!guest&&name==='home'&&!location.hash){ R.innerHTML=authScreen(); bindAuth(); return; }
  const u=me();
  let inner='', wide=false;
  switch(name){
    case 'home': {
      const vids = UI.sort==='smart'? boostSort(DB.videos.filter(isLive),'smart')
                                     : sortItems(DB.videos.filter(isLive),UI.sort);
      const pst=sortItems(DB.posts.filter(isLive),'latest').slice(0,6);
      inner=pageTitle(t('home'))+sortBar()+gridHTML(vids)+
        (pst.length?'<div style="margin-top:34px"><div class="label" style="margin-bottom:14px">'+esc(t('freshPosts'))+'</div>'+
          feedHTML(pst)+'<div style="margin-top:14px"><a class="btn btn-sm" href="#/posts">'+esc(t('allPosts'))+'</a></div></div>':'');
      wide=true; break; }
    case 'videos': inner=pageTitle(t('videos'))+sortBar()+gridHTML(sortItems(DB.videos.filter(isLive),UI.sort)); wide=true; break;
    case 'posts': {
      const pool=DB.posts.filter(isLive);
      // Для постов свой рейтинг: обсуждаемость и свежесть важнее просмотров
      const list = UI.sort==='smart'
        ? pool.map(p=>({p,s:postScore(p)})).sort((a,b)=>b.s-a.s).map(x=>x.p)
        : sortItems(pool,UI.sort);
      inner=pageTitle(t('posts'))+sortBar()+feedHTML(list,'emptyPosts');
      break; }
    case 'trending': {
      // В тренде — материалы с наибольшей вовлечённостью за последние две недели
      wide=true;
      const since=Date.now()-14*86400000;
      const hot=allItems().filter(i=>isLive(i)&&i.createdAt>since);
      const pool=hot.length?hot:allItems().filter(isLive);
      const rate=i=>(i.likes.length*3+commentsOf(i.id).length*5+savesOf(i.id)*6+(i.views||0)*0.2-i.dislikes.length*2)
        /Math.pow(Math.max(1,(Date.now()-i.createdAt)/86400000)+1,0.4);
      inner=pageTitle(t('trending'))+gridHTML(pool.slice().sort((a,b)=>rate(b)-rate(a)).filter(i=>i.type==='video'))+
        feedHTML(pool.slice().sort((a,b)=>rate(b)-rate(a)).filter(i=>i.type!=='video').slice(0,10));
      break; }
    case 'subs': {
      if(!u){ inner=pageTitle(t('subs'))+'<div class="empty">'+esc(t('needAuth'))+'</div>'; break; }
      // На вкладке подписок показываем сами каналы, а не их ролики
      const chans=(u.following||[]).map(userBy).filter(Boolean);
      wide=true;
      inner=pageTitle(t('subs'),chans.length+' '+t('channels'))+
       (chans.length? '<div class="chan-grid stagger">'+chans.map(c=>{
         const last=allItems().filter(i=>i.author===c.username&&isLive(i)).sort((x,y)=>y.createdAt-x.createdAt)[0];
         return '<div class="card" style="padding:16px">'+
          '<div style="display:flex;gap:12px;align-items:center">'+avatarHTML(c,48)+
           '<div style="flex:1;min-width:0"><a href="#/c/'+esc(c.username)+'" style="font-weight:700;display:flex;gap:5px;align-items:center">'+
            esc(c.name)+(c.isVerified?VER:'')+lbMark(c.username)+'</a>'+
           '<div class="mono" style="color:var(--dim);font-size:12px">@'+esc(c.username)+' · '+followersOf(c.username)+' '+esc(t('subsCnt'))+'</div></div></div>'+
          (last? '<a href="'+linkOf(last)+'" style="display:block;margin-top:12px;color:var(--muted);font-size:13px">'+
            esc(t('lastItem'))+': '+esc(String(last.title||last.text||'').slice(0,40))+'</a>' : '')+
          '<button class="btn btn-sm js-unsub" data-user="'+esc(c.username)+'" style="margin-top:12px;width:100%">'+esc(t('unsubscribe'))+'</button>'+
         '</div>'; }).join('')+'</div>'
        : '<div class="empty">'+esc(t('emptySubs'))+'</div>');
      break; }
    case 'marks': {
      if(!u){ inner=pageTitle(t('marks'))+'<div class="empty">'+esc(t('needAuth'))+'</div>'; break; }
      const ids=(u.bookmarks||[]).map(b=>b.id);
      const saved=sortItems(allItems().filter(i=>ids.includes(i.id)),UI.sort==='smart'?'latest':UI.sort);
      wide=true;
      inner=pageTitle(t('marks'))+sortBar(true)+
        gridHTML(saved.filter(i=>i.type==='video'),'emptyMarks')+
        (saved.some(i=>i.type!=='video')? '<div style="margin-top:26px">'+feedHTML(saved.filter(i=>i.type!=='video'))+'</div>':'');
      break; }
    case 'search': inner=searchPage(ROUTE.arg); break;
    case 'support': inner=supportPage(); break;
    case 'settings': inner=settingsPage(); break;
    case 'create': inner=createPage(); break;
    case 'studio': inner=studioPage(); wide=true; break;
    case 'leaders': inner=leaderboardPage(); wide=true; break;
    case 'c': inner=channelPage(ROUTE.arg); wide=true; break;
    case 'watch': inner=watchPage(ROUTE.arg); wide=true; break;
    case 'post': inner=postPage(ROUTE.arg); break;
    default: inner='<div class="empty">'+esc(t('notFound'))+'</div>';
  }
  R.innerHTML=shell(inner,wide);
  bindShell(); bindCards();
  if(name==='c') bindChannel();
  if(name==='support') bindSupport();
  if(name==='settings') bindSettings();
  if(name==='create') bindCreate();
  if(name==='studio') bindStudio();
  if(name==='post'){ const it=(ROUTE.bySlug==='p'? bySlug(ROUTE.arg,'p') : DB.posts.find(p=>p.id===ROUTE.arg)||bySlug(ROUTE.arg,'p'));
    const eb=$('#editMetaPost'); if(eb&&it) eb.onclick=()=>ownerEdit(it);
    if(it&&canSee(it,u)){ if(registerView(it.id)) saveDB(); bindComments(it); } }
  if(name==='watch'){
    const it=(ROUTE.bySlug==='v'? bySlug(ROUTE.arg,'v') : DB.videos.find(v=>v.id===ROUTE.arg)||bySlug(ROUTE.arg,'v'));
    if(it&&canSee(it,u)){
      if(registerView(it.id)){ abTrack(it,'clk'); saveDB(); }
      initPlayer(it); bindComments(it);
      if(premPhase(it)!=='normal') bindPremChat(it);
      if(premPhase(it)!=='countdown') setTimeout(()=>chapterMarkers(it),400);
      $$('.js-chap').forEach(b=> b.onclick=()=>{
        if(PL.locked){ toast(t('lockedSeek')); return; }
        const at=+b.dataset.at;
        if(PL.liveMode&&at>liveEdge(it)){ toast(t('noSeekFwd')); return; }
        PL.cur=at; if(PL.v&&!PL.virtual) PL.v.currentTime=at;
        if(PL.ui) PL.ui(); if(PL.play) PL.play();
      });
      const db2=$('#descBox');
      if(db2) db2.onclick=()=>{ db2.classList.toggle('open');
        $('.desc-more',db2).textContent = db2.classList.contains('open')? t('hideStats').replace(/статистику|stats/i,'').trim()||'—' : t('showMore');
        $('.desc-more',db2).textContent = db2.classList.contains('open')? '—' : t('showMore'); };
      const em=$('#editMeta');
      if(em) em.onclick=()=>ownerEdit(it);
      const f=$('#followBtn');
      if(f) f.onclick=()=>{ if(!requireAuth()) return;
        const cu=me(),tg=f.dataset.user,i=cu.following.indexOf(tg);
        if(i>=0){ cu.following.splice(i,1); toast(t('toastUnsub')); }
        else { cu.following.push(tg); DB.follows.push({from:cu.username,to:tg,at:Date.now()});
          notify(tg,'@'+cu.username+' '+t('notifSub'),'#/c/'+cu.username); toast(t('toastSub')); }
        saveDB();
        // обновляем только кнопку и счётчик — воспроизведение продолжается
        const nowFollow=(me().following||[]).includes(tg);
        f.textContent = nowFollow? t('unsubscribe') : t('subscribe');
        f.classList.toggle('btn-primary',!nowFollow);
        const cnt=document.querySelector('.watch-head .mono');
        if(cnt) cnt.textContent=followersOf(tg)+' '+t('subsCnt');
        f.setAttribute('data-following',nowFollow?'1':'0');
      };
    }
  }
}

/* ==================================================================
   ЗАПУСК И СИНХРОНИЗАЦИЯ ВКЛАДОК
   ================================================================== */
ROUTE=parseHash();
if(!location.hash && !SESSION && sessionStorage.getItem('orbit_guest')!=='1'){ ROUTE={name:'auth',arg:'',tab:''}; }
render();
/* Изменения из других вкладок этого же браузера подхватываются на лету */
window.addEventListener('storage',e=>{
  if(e.key!==LS.DB&&e.key!==LS.SESSION) return;
  DB=loadDB();
  if(!$('#modals').innerHTML) render();
});
setInterval(()=>{
  if($('#modals').innerHTML) return;
  const before=unreadCount();
  DB=loadDB();
  const u=me();
  if(SESSION&&(!u||banInfo(u))){ render(); return; }
  if(unreadCount()!==before) render();
  // публикация по расписанию: как только время наступило, материал появляется в лентах
  const due=allItems().filter(i=>i.publishAt&&i.publishAt<=Date.now());
  if(due.length){
    due.forEach(i=>{
      i.publishAt=0;
      if(i.type==='video'&&i.privacy==='public'){
        const au=userBy(i.author);
        DB.users.filter(x=>(x.following||[]).includes(i.author))
          .forEach(x=>notify(x.username,'@'+i.author+' '+t('notifNewVideo')+': '+i.title,linkOf(i)));
      }
    });
    saveDB(); render();
  }
}, 6000);
</script>
