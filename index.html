<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orbit</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#0a0a0a; --panel:#111; --panel2:#161616; --panel3:#1d1d1d;
  --line:#232323; --line2:#2f2f2f;
  --text:#ededed; --muted:#8f8f8f; --dim:#666;
  --accent:#fff; --blue:#5b8def; --ok:#3fb950; --warn:#d29922; --danger:#f2585f; --live:#ff3b30;
  --r:12px; --rs:8px; --sb:250px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.55;
  font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:20px}::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid #4b4b4b;outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- анимации --- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
.anim-in{animation:rise .22s cubic-bezier(.2,.7,.3,1) both}
.stagger>*{animation:rise .26s cubic-bezier(.2,.7,.3,1) both}
.stagger>*:nth-child(1){animation-delay:.01s}.stagger>*:nth-child(2){animation-delay:.04s}
.stagger>*:nth-child(3){animation-delay:.07s}.stagger>*:nth-child(4){animation-delay:.1s}
.stagger>*:nth-child(5){animation-delay:.13s}.stagger>*:nth-child(6){animation-delay:.16s}
.spinner{width:18px;height:18px;border:2px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}

/* --- кнопки --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:999px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;font-weight:600;font-size:14px;
  transition:background .16s cubic-bezier(.2,.7,.3,1),border-color .16s,transform .12s cubic-bezier(.2,.7,.3,1),box-shadow .16s}
.btn:hover{background:var(--panel3);border-color:#3a3a3a}
.btn:active{transform:scale(.96)}
.btn-primary{box-shadow:0 1px 0 rgba(255,255,255,.16) inset}
.btn-primary:active{transform:scale(.96)}
.icon-btn{transition:background .16s,color .16s,transform .12s}
.icon-btn:active{transform:scale(.92)}
.chip{transition:background .16s,color .16s,border-color .16s,transform .12s}
.chip:active{transform:scale(.96)}
.side-btn{transition:background .16s cubic-bezier(.2,.7,.3,1),color .16s}
.card{transition:border-color .18s,background .18s}
.tab{transition:background .16s,color .16s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}
.btn-primary:hover{background:#e2e2e2}
.btn-danger{border-color:#4a2226;color:#f2858a}.btn-danger:hover{background:#1e1213}
.btn-ok{border-color:#1f4429;color:#67d67e}.btn-ok:hover{background:#101c13}
.btn-live{background:var(--live);border-color:var(--live);color:#fff}
.btn-sm{padding:6px 13px;font-size:13px}
.btn-ghost{border-color:transparent;color:var(--muted)}.btn-ghost:hover{background:var(--panel2);color:var(--text)}
.icon-btn{width:38px;height:38px;padding:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:.15s;flex:0 0 auto}
.icon-btn:hover{background:var(--panel2);color:var(--text)}

/* --- формы --- */
.input,.select,.textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);
  padding:11px 13px;outline:none;transition:border-color .15s;font-size:14.5px}
.input:focus,.select:focus,.textarea:focus{border-color:#454545}
.input.err{border-color:#5c2a2e}
.input::placeholder,.textarea::placeholder{color:#555}
.textarea{resize:vertical;min-height:100px;line-height:1.6}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);
  background-position:calc(100% - 17px) 53%,calc(100% - 12px) 53%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.45}
.err-text{font-size:12.5px;color:#f2858a;margin-top:6px}
.rule{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);padding:2px 0}
.rule.ok{color:#67d67e}.rule .mark{width:14px;text-align:center;font-family:var(--mono)}
.drop{border:1px dashed var(--line2);border-radius:12px;padding:18px;text-align:center;transition:.18s;cursor:pointer}
.drop:hover,.drop.over{border-color:#5a5a5a;background:#0e0e0e}

/* --- поверхности --- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);transition:border-color .18s}
.card:hover{border-color:#2b2b2b}
.divider{height:1px;background:var(--line);border:0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;
  border:1px solid var(--line2);background:var(--panel2);color:var(--muted)}
.badge-blue{color:#8ab4f8;border-color:#25344d;background:#111823}
.badge-warn{color:#e3b341;border-color:#3d3419;background:#1a1710}
.badge-red{color:#f2858a;border-color:#42222a;background:#1a1013}
.badge-ok{color:#67d67e;border-color:#1f4429;background:#0f1a13}
.badge-live{color:#fff;background:var(--live);border-color:var(--live)}
.badge-live::before{content:"";width:6px;height:6px;border-radius:999px;background:#fff;animation:pulse 1.4s infinite}
.avatar{border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#0a0a0a;
  flex:0 0 auto;user-select:none;cursor:pointer;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.tab{padding:8px 15px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--muted);
  cursor:pointer;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.active{color:var(--text);background:var(--panel3);border-color:var(--line2)}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);
  cursor:pointer;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.active{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}
.plate{border:1px solid #42222a;background:#160f11;border-radius:var(--r);padding:13px 15px;margin-bottom:14px}
.plate-warn{border-color:#3d3419;background:#161310}

/* --- каркас --- */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sb);flex:0 0 var(--sb);border-right:1px solid var(--line);background:var(--bg);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:12px 10px;gap:2px;z-index:40;
  transition:width .22s cubic-bezier(.2,.7,.3,1),flex-basis .22s cubic-bezier(.2,.7,.3,1)}
.sidebar.mini{--sb:72px;width:72px;flex-basis:72px}
.sidebar.mini .side-txt,.sidebar.mini .brand-txt{display:none}
.sidebar.mini .side-btn{justify-content:center;padding:11px 0}
.sidebar.mini .brand{display:none!important}
.sidebar.mini .brand-row{justify-content:center;padding:6px 0 14px}
.side-btn{display:flex;align-items:center;gap:13px;width:100%;padding:10px 13px;border-radius:999px;border:1px solid transparent;
  background:transparent;color:var(--muted);cursor:pointer;font-weight:500;font-size:15px;text-align:left;transition:.15s;position:relative}
.side-btn:hover{background:var(--panel2);color:var(--text)}
.side-btn.active{color:var(--text);font-weight:700;background:var(--panel2)}
.side-btn svg{width:20px;height:20px;flex:0 0 auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:9px;padding:10px 18px;
  border-bottom:1px solid var(--line);background:rgba(10,10,10,.88);backdrop-filter:blur(12px)}
.content{padding:22px 18px 90px;max-width:1480px;width:100%;margin:0 auto}
.content.wide{max-width:1400px}
.mobile-nav{display:none}
.counter-badge{position:absolute;top:5px;left:28px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.sidebar.mini .counter-badge{left:auto;right:14px}

/* --- модалки и меню --- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.74);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;animation:fade .14s ease}
.modal{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  animation:rise .18s ease;margin:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.modal-body{padding:18px}
.menu-fs{position:fixed;z-index:2147483647}
.menu{position:absolute;background:#1a1a1a;border:1px solid var(--line2);border-radius:10px;padding:6px;
  min-width:190px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:rise .13s ease}
.menu-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:9px 11px;border-radius:7px;
  border:0;background:transparent;color:var(--text);cursor:pointer;font-size:13.5px;text-align:left;transition:.12s}
.menu-item:hover{background:#252525}
.menu-item .chk{color:var(--blue);font-weight:700}
.menu-head{padding:7px 11px;font-size:11.5px;color:var(--dim);font-weight:600}

/* --- лента --- */
.feed{display:flex;flex-direction:column;max-width:760px}
.feed>article{border-bottom:1px solid var(--line);padding:16px 4px}
.feed>article:hover{background:#0d0d0d}
.grid-videos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.chan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
@media (max-width:1400px){.grid-videos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1050px){.grid-videos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid-videos{grid-template-columns:1fr}}
.vcard{background:transparent;border:0;padding:0!important}
.vcard:hover .thumb{border-color:#3a3a3a}
.vcard .act-row{opacity:0;transition:opacity .16s;margin-top:6px}
.vcard:hover .act-row,.vcard:focus-within .act-row{opacity:1}
.vmeta{display:flex;gap:11px;margin-top:11px}
.vtitle{font-weight:700;font-size:14.5px;letter-spacing:-.01em;line-height:1.35;display:block}
.vtitle:hover{color:#fff}
.watch-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:14px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;cursor:pointer;background:#181818;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;
  font-weight:600;font-size:15px;color:#cfcfcf;transition:border-color .18s}
.thumb video.prev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:4;background:#000}
.prev-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);z-index:5}
.prev-bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s linear}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .dur{position:absolute;right:7px;bottom:7px;z-index:3;background:rgba(0,0,0,.85);padding:2px 6px;border-radius:5px;
  font-family:var(--mono);font-size:11.5px;color:#fff}
.thumb .play{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.32);opacity:0;transition:opacity .17s}
.thumb:hover .play{opacity:1}
.embed{border:1px solid var(--line2);border-radius:12px;padding:12px;margin-top:10px;background:#0d0d0d;cursor:pointer}
.embed:hover{border-color:#3a3a3a}
.act{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid transparent;
  background:transparent;color:var(--dim);cursor:pointer;font-size:13px;font-weight:600;transition:.14s}
.act:hover{background:var(--panel2);color:var(--text)}
.act svg{width:17px;height:17px}
.act-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:10px}
.act-big{padding:9px 15px;border:1px solid var(--line2);background:var(--panel2);font-size:13.5px;color:var(--text);
  height:38px;justify-content:center}
.act-big:hover{background:var(--panel3);border-color:#3a3a3a}
.act-row .act-big.on-like,.act-row .act-big.on-mark{background:#fff;color:#0a0a0a;border-color:#fff}
.act-row .act-big.on-dis{background:#2a1417;color:#f2858a;border-color:#5c2a2e}
.act-lbl{font-weight:600;white-space:nowrap}
/* Лайк и дизлайк живут в одной капсуле и не смещают соседей */
.act-pair{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;
  background:var(--panel2);overflow:hidden;height:38px}
.act-pair .act-big{border:0;border-radius:0;background:transparent;height:36px}
.act-pair .act-big:first-child{padding-right:13px}
.act-pair .act-sep{width:1px;height:20px;background:var(--line2);flex:0 0 auto}
.act-row .act-pair .act-big.on-like{background:#fff;color:#0a0a0a}
.act-row .act-pair .act-big.on-dis{background:#2a1417;color:#f2858a}
.act-big .mono{min-width:14px;text-align:center;display:inline-block}
.act-big.js-like{min-width:112px}
.act-big.js-mark{min-width:132px}
.act-more{margin-left:auto}
.act-row .act.on-like{color:#fff}.act-row .act.on-dis{color:#f2858a}.act-row .act.on-mark{color:#8ab4f8}
.ph-grid{display:grid;gap:4px;margin-top:12px;border-radius:12px;overflow:hidden;max-width:560px}
.ph-1{grid-template-columns:1fr}
.ph-2{grid-template-columns:1fr 1fr}
.ph-3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.ph-3 .ph-cell:first-child{grid-row:span 2}
.ph-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.ph-cell{position:relative;background:#181818;cursor:pointer;aspect-ratio:16/10;overflow:hidden;transition:opacity .15s}
.ph-1 .ph-cell{aspect-ratio:16/9}
.ph-cell:hover{opacity:.9}
.ph-cell img{width:100%;height:100%;object-fit:cover;display:block}
.ph-more{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;color:#fff;z-index:2}
.lb-view{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;
  animation:fade .15s ease}
.lb-view img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:8px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:999px;
  background:rgba(255,255,255,.14);border:0;color:#fff;cursor:pointer;font-size:22px}
.lb-nav:hover{background:rgba(255,255,255,.24)}
.poll{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:#0d0d0d}
.poll-opt{display:block;width:100%;text-align:left;padding:10px 13px;border-radius:9px;border:1px solid var(--line2);
  background:transparent;color:var(--text);cursor:pointer;font-size:14px;margin-bottom:8px;transition:.15s}
.poll-opt:hover{background:var(--panel2);border-color:#3d3d3d}
.poll-res{position:relative;padding:10px 13px;border-radius:9px;border:1px solid var(--line);margin-bottom:8px;
  overflow:hidden;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.poll-res.mine{border-color:#3d5a8a}
.poll-bar{position:absolute;left:0;top:0;bottom:0;background:#1e1e1e;transition:width .4s cubic-bezier(.2,.7,.3,1)}
.poll-res.mine .poll-bar{background:#182437}
.poll-txt,.poll-pc{position:relative;z-index:2}
.poll-pc{color:var(--muted);font-size:12.5px;white-space:nowrap}
.lb-mark{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:999px;
  font-size:10.5px;font-weight:800;color:#0a0a0a;flex:0 0 auto;font-family:var(--mono)}
.lb-1{background:#f5c542;box-shadow:0 0 0 1px rgba(245,197,66,.35)}
.lb-2{background:#c8ccd4;box-shadow:0 0 0 1px rgba(200,204,212,.35)}
.lb-3{background:#c1662f;color:#fff;box-shadow:0 0 0 1px rgba(193,102,47,.4)}
.lb-name-1{color:#f5c542}.lb-name-2{color:#c8ccd4}.lb-name-3{color:#c1662f}
.mention{color:var(--blue);font-weight:600;cursor:pointer}
.mention:hover{text-decoration:underline}
.stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:0}
.chat-msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.55;border:1px solid var(--line)}
.chat-user{background:var(--panel2);margin-left:auto;border-bottom-right-radius:4px}
.chat-admin{background:#0d0d0d;border-bottom-left-radius:4px}

/* --- плеер --- */
.player-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;width:100%}
.player-wrap:fullscreen{border-radius:0;aspect-ratio:auto;height:100vh;width:100vw}
.player-wrap:fullscreen video{border-radius:0}
.pl-ctrl{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:8px 12px 10px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.88));opacity:1;transition:opacity .25s}
.player-wrap.idle .pl-ctrl{opacity:0;pointer-events:none}
.progress{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.22);cursor:pointer;transition:height .13s}
.progress:hover{height:8px}
.progress-buf{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:rgba(255,255,255,.28)}
.progress-fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff}
.progress-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:999px;background:#fff;
  opacity:0;transition:opacity .13s}
.progress:hover .progress-dot{opacity:1}
.progress.locked{cursor:not-allowed;background:rgba(255,255,255,.12)}
.progress.locked:hover{height:4px}
.pl-btn{width:34px;height:34px;border-radius:999px;border:0;background:transparent;color:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:background .14s}
.pl-btn:hover{background:rgba(255,255,255,.16)}
.pl-txt{background:transparent;border:0;color:#fff;cursor:pointer;font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:6px;
  font-family:var(--mono)}
.pl-txt:hover{background:rgba(255,255,255,.16)}
input[type=range].vol{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;outline:none;
  background:linear-gradient(90deg,#fff 0%,#fff var(--fill,90%),rgba(255,255,255,.28) var(--fill,90%),rgba(255,255,255,.28) 100%)}
input[type=range].vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:999px;background:#fff;cursor:pointer}
input[type=range].vol::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:999px;background:#fff;cursor:pointer}
.pl-row{display:flex;align-items:center;gap:5px;margin-top:8px}
.pl-time{font-size:12.5px;color:#e9e9e9;padding-left:4px;white-space:nowrap}
.pl-chap{font-size:12.5px;color:#b9b9b9;margin-left:8px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-vol{display:flex;align-items:center;gap:0;overflow:hidden}
.pl-vol input{width:0;opacity:0;transition:width .2s ease,opacity .2s ease,margin .2s ease}
.pl-vol:hover input,.pl-vol input:focus{width:76px;opacity:1;margin:0 8px 0 4px}
.pl-volnum{font-size:11.5px;color:#cfcfcf;width:0;opacity:0;overflow:hidden;transition:width .2s,opacity .2s}
.pl-vol:hover .pl-volnum{width:26px;opacity:1}
.pl-hover{position:absolute;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.9);border:1px solid #2f2f2f;
  padding:3px 8px;border-radius:6px;font-size:11.5px;white-space:nowrap;opacity:0;transition:opacity .12s;pointer-events:none;color:#fff}
.pl-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(0,0,0,.62);
  color:#fff;border-radius:999px;width:74px;height:74px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pl-center.go{animation:popout .5s ease forwards}
@keyframes popout{0%{opacity:1;transform:translate(-50%,-50%) scale(.85)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
.prem-bar{position:absolute;left:12px;top:12px;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);
  border-radius:999px;padding:7px 14px;max-width:calc(100% - 24px)}
.prem-label{font-size:12.5px;color:#cfcfcf}
.prem-time{font-size:15px;font-weight:800;letter-spacing:.02em;color:#fff}
.prem-at{font-size:11.5px;color:#8f8f8f}
.pl-live{position:absolute;left:12px;top:12px;z-index:11;display:inline-flex;align-items:center;gap:7px;
  background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);color:#fff;
  border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.pl-live:hover{background:rgba(0,0,0,.9);border-color:rgba(255,255,255,.3)}
.pl-live .dot{width:7px;height:7px;border-radius:999px;background:#8f8f8f}
.pl-live.at-live .dot{background:var(--live);animation:pulse 1.4s infinite}
.pl-live.at-live{border-color:rgba(255,59,48,.5)}
.progress.fwd-locked{cursor:default}
.progress .live-edge{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--live);border-radius:2px;pointer-events:none}
.live-pill{position:absolute;left:12px;top:12px;z-index:11;display:inline-flex;align-items:center;gap:7px;
  background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;
  border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.live-pill:hover{background:rgba(255,255,255,.16)}
.live-pill.behind{border-color:rgba(242,88,95,.6)}
.pchat-msg{font-size:13.5px;line-height:1.5;animation:slideL .18s ease both}
.pchat-user{font-weight:700;cursor:pointer;margin-right:4px}
.pchat-txt{margin-left:5px;color:var(--text)}
.live-dot{width:7px;height:7px;border-radius:999px;background:var(--live);animation:pulse 1.4s infinite}
.trailer-tag{left:auto!important;right:12px;top:12px;z-index:10;background:rgba(0,0,0,.72);border-color:rgba(255,255,255,.14);color:#fff}

.trailer-tag{position:absolute;left:12px;top:12px;z-index:10}

.notif-item:hover{background:var(--panel2);border-color:var(--line)}
.notif-dot{width:7px;height:7px;border-radius:999px;background:transparent;margin-top:6px;flex:0 0 auto}
.notif-item.unread{background:#0f1319}

.h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em}

.live-msg{font-size:13.5px;line-height:1.5;animation:slideL .18s ease both}

const REGIONS=['EU','AS','NA','SA','AF','OC','AN'];

function emptyDB(){
  return { version:DB_VERSION, createdAt:Date.now(),
    users:[{ id:'u_admin', username:'admin', password:'admin123', name:'Администрация', initials:'A',
      color:'#e5e5e5', avatarKey:'', bio:'', region:'EU', role:'admin', isVerified:true, showStaff:true,
      banned:false, bannedUntil:0, banReason:'', following:[], bookmarks:[], notifications:[], createdAt:Date.now() }],
    posts:[], videos:[], comments:[], tickets:[], logs:[], views:[], bans:[], restrictions:[], follows:[], premchat:[] };
}
function loadDB(){
  let raw=null; try{ raw=localStorage.getItem(LS.DB); }catch(e){}
  if(raw===null||raw===''){ const f=emptyDB(); try{ localStorage.setItem(LS.DB,JSON.stringify(f)); }catch(e){} return f; }
  let db=null; try{ db=JSON.parse(raw); }catch(e){}
  if(!db||typeof db!=='object'||!Array.isArray(db.users)){
    try{ localStorage.setItem(LS.DB+'_backup_'+Date.now(),raw); }catch(e){}
    const f=emptyDB(); localStorage.setItem(LS.DB,JSON.stringify(f)); return f;
  }
  // Мягкая миграция: только дополняем недостающее, ничего не удаляя
  ['posts','videos','comments','tickets','logs','views','bans','restrictions','follows','premchat']
    .forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
  db.users.forEach(u=>{
    ['following','bookmarks','notifications'].forEach(k=>{ if(!Array.isArray(u[k])) u[k]=[]; });
    if(typeof u.banned!=='boolean') u.banned=false;
    if(typeof u.bannedUntil!=='number') u.bannedUntil=0;
    if(typeof u.showStaff!=='boolean') u.showStaff=(u.role==='admin');
    if(!u.color) u.color='#e5e5e5';
    if(u.region==='RU')u.region='EU'; else if(u.region==='US')u.region='NA'; else if(u.region==='AE')u.region='AS';
    if(!REGIONS.includes(u.region)) u.region='EU';
  });
  db.videos.forEach(v=>{ if(!Array.isArray(v.tags)) v.tags=[]; if(!v.category) v.category='none'; });
  db.videos.concat(db.posts).forEach(x=>{ if(!x.slug){
    const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let o=''; for(let i=0;i<13;i++) o+=A[Math.floor(Math.random()*A.length)]; x.slug=o; } });
  if(!db.users.some(u=>u.role==='admin')) db.users.push(emptyDB().users[0]);
  db.version=DB_VERSION;
  return db;
}

}

/* ------------------------- Медиа в IndexedDB ------------------------- */
const MEDIA={ name:'orbit_media_v3', store:'files', db:null, MAX:500*1024*1024 };
const OK_VIDEO=['video/mp4','video/webm','video/ogg','video/quicktime','video/x-matroska'];
function mOpen(){
  return new Promise((res,rej)=>{
    if(MEDIA.db) return res(MEDIA.db);
    if(!window.indexedDB) return rej(new Error('no-idb'));
    const rq=indexedDB.open(MEDIA.name,1);
    rq.onupgradeneeded=()=>{ const d=rq.result; if(!d.objectStoreNames.contains(MEDIA.store)) d.createObjectStore(MEDIA.store); };
    rq.onsuccess=()=>{ MEDIA.db=rq.result; res(MEDIA.db); };
    rq.onerror=()=>rej(rq.error);
  });
}
const mPut=(k,b)=>mOpen().then(d=>new Promise((res,rej)=>{
  const tx=d.transaction(MEDIA.store,'readwrite'); tx.objectStore(MEDIA.store).put(b,k);
  tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }));
const mGet=k=>mOpen().then(d=>new Promise((res,rej)=>{
  const rq=d.transaction(MEDIA.store,'readonly').objectStore(MEDIA.store).get(k);
  rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); })).catch(()=>null);
const mDel=k=>mOpen().then(d=>new Promise(res=>{
  const tx=d.transaction(MEDIA.store,'readwrite'); tx.objectStore(MEDIA.store).delete(k);
  tx.oncomplete=()=>res(1); tx.onerror=()=>res(0); })).catch(()=>0);
const URLC={};
function mURL(k){
  if(!k) return Promise.resolve(null);
  if(URLC[k]) return Promise.resolve(URLC[k]);
  return mGet(k).then(b=>{ if(!b) return null; const u=URL.createObjectURL(b); URLC[k]=u; return u; });
}
function fmtBytes(b){
  if(b>=1073741824) return (b/1073741824).toFixed(2)+' GB';
  if(b>=1048576) return (b/1048576).toFixed(1)+' MB';
  if(b>=1024) return (b/1024).toFixed(0)+' KB';
  return b+' B';
}

function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return t('now');
  const m=Math.floor(s/60); if(m<60) return m+' '+t('mShort')+' '+t('ago');
  const h=Math.floor(m/60); if(h<24) return h+' '+t('hShort')+' '+t('ago');

function fmtTime(sec){

  return h>0? h+':'+p(m)+':'+p(s) : p(m)+':'+p(s);
}
/* Читаемый отсчёт: крупные единицы словами, ниже — точное время до секунды */
function plural(n,forms){
  if(LANG!=='ru') return n===1?forms[0]:forms[1];
  const a=Math.abs(n)%100, b=a%10;
  if(a>10&&a<20) return forms[2];
  if(b>1&&b<5) return forms[1];
  if(b===1) return forms[0];
  return forms[2];
}
function fmtCountdown(ms){
  let s=Math.max(0,Math.floor(ms/1000));
  const y=Math.floor(s/31536000); s-=y*31536000;
  const mo=Math.floor(s/2592000); s-=mo*2592000;
  const d=Math.floor(s/86400); s-=d*86400;
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60,p=n=>String(n).padStart(2,'0');
  const big=[];
  if(y) big.push(y+' '+(LANG==='ru'?plural(y,['год','года','лет']):plural(y,['year','years'])));
  if(mo) big.push(mo+' '+(LANG==='ru'?plural(mo,['месяц','месяца','месяцев']):plural(mo,['month','months'])));
  if(d) big.push(d+' '+(LANG==='ru'?plural(d,['день','дня','дней']):plural(d,['day','days'])));
  const clock=p(h)+':'+p(m)+':'+p(x);
  return big.length? big.slice(0,2).join(' ')+' · '+clock : clock;
}

function sortItems(arr,mode){

/* Рекомендательный алгоритм ленты.
   Учитывает вовлечённость (лайки, комментарии, закладки, просмотры),
   свежесть материала, доверенность автора и личные связи зрителя:
   подписки, интерес к автору и совпадение тегов с недавно просмотренным. */
function rankScore(it,ctx){
  const age=Math.max(0.02,(Date.now()-it.createdAt)/3600000);        // возраст в часах
  const likes=it.likes.length, dis=it.dislikes.length;
  const cm=commentsOf(it.id).length, sv=savesOf(it.id), vw=it.views||0;
  // база вовлечённости: комментарий и сохранение весят больше лайка
  let eng = likes*3 + cm*5 + sv*6 + Math.min(vw,5000)*0.15 - dis*2;
  // доля лайков к просмотрам поощряет качественный, а не просто популярный материал
  if(vw>4) eng *= 1 + Math.min(1,(likes/vw))*0.8;
  // свежесть: спад мягкий, чтобы хорошее не тонуло за сутки
  const fresh = 1 / Math.pow(age+6, 0.42);
  let score = (eng+8) * fresh * 10;
  const a=userBy(it.author);
  if(a&&a.isVerified) score *= 1.35;                                 // повышенный охват доверенных
  if(a&&a.role==='admin') score *= 1.1;
  if(ctx.following.includes(it.author)) score *= 4;                // подписки важнее всего
  if(ctx.seenAuthors[it.author]) score *= 1.25;                      // автор уже интересовал зрителя
  const tags=(it.tags||[]);
  if(tags.length&&ctx.tags.length){
    const hit=tags.filter(g=>ctx.tags.includes(g)).length;
    if(hit) score *= 1 + Math.min(0.6,hit*0.2);
  }
  if(ctx.seen[it.id]) score *= 0.35;                                 // уже просмотренное опускается
  if(it.premiere&&it.premiereAt>Date.now()) score *= 1.5;            // будущие премьеры подсвечиваем
  if(it.ageLimit) score *= 0.9;
  return score;
}
/* Рейтинг поста: живое обсуждение и реакции за последние сутки весят больше всего */
function postScore(p){
  const ageH=Math.max(0.3,(Date.now()-p.createdAt)/3600000);
  const cm=commentsOf(p.id);
  const recentCm=cm.filter(c=>Date.now()-c.createdAt<86400000).length;
  const votes=p.poll? p.poll.options.reduce((s2,o)=>s2+o.votes.length,0) : 0;
  let sc = p.likes.length*4 + cm.length*6 + recentCm*8 + savesOf(p.id)*7 + votes*3 - p.dislikes.length*3;
  if((p.photos||[]).length) sc*=1.15;                    // посты со снимками читают охотнее
  if(p.type==='quote') sc*=1.05;
  const u=me();
  if(u&&(u.following||[]).includes(p.author)) sc*=3;
  const a=userBy(p.author);
  if(a&&a.isVerified) sc*=1.3;
  return (sc+6)/Math.pow(ageH+4,0.5);
}
/* Контекст зрителя строится из его подписок и истории просмотров */
function rankContext(){
  const u=me();
  const who=u?u.username:localStorage.getItem('orbit_guest_id');
  const mine=DB.views.filter(v=>v.who===who).slice(-120);
  const seen={}, seenAuthors={}, tagCount={};
  mine.forEach(v=>{ seen[v.item]=1;
    const it=findItem(v.item); if(!it) return;
    seenAuthors[it.author]=(seenAuthors[it.author]||0)+1;
    (it.tags||[]).forEach(g=>{ tagCount[g]=(tagCount[g]||0)+1; });
  });
  const tags=Object.keys(tagCount).sort((a,b)=>tagCount[b]-tagCount[a]).slice(0,8);
  return { following:(u&&u.following)||[], seen, seenAuthors, tags };
}
/* Основная выдача: mode 'smart' — рекомендации, остальные — обычные сортировки */
function boostSort(arr,mode){
  if(mode&&mode!=='smart'){
    const v=[],r=[];
    arr.forEach(i=>{ const a=userBy(i.author); (a&&a.isVerified?v:r).push(i); });
    return sortItems(v,mode).concat(sortItems(r,mode));
  }
  const ctx=rankContext();
  return arr.map(i=>({i,s:rankScore(i,ctx)})).sort((a,b)=>b.s-a.s).map(x=>x.i);
}
function searchFilter(arr,q){

      it.id.toLowerCase()===q||(a&&(a.name.toLowerCase().includes(q)||a.username.toLowerCase().includes(q)));
  });
}

function canComment(it,u){

  if(p==='all') return {ok:true};

/* Топ-100 таблицы лидеров: место определяется единожды и используется везде.
   В nameHTML/lbMark показываются только места 1-99; место 101+ вообще не отображается. */
let LB_CACHE={at:0,map:{}};
function lbTop3(){
  if(Date.now()-LB_CACHE.at<4000) return LB_CACHE.map;
  const since=Date.now()-86400000;
  const rows=DB.users.map(u=>({u:u.username,
    g:DB.follows.filter(f=>f.to===u.username&&f.at>=since).length, tot:followersOf(u.username)}))
    .filter(r=>r.g>0||r.tot>0)
    .sort((a,b)=>b.g-a.g||b.tot-a.tot).slice(0,100);
  const map={};
  rows.forEach((r,i)=>{ if(r.g>0||r.tot>0) map[r.u]=i+1; });
  LB_CACHE={at:Date.now(),map};
  return map;
}
const LB_COLORS={1:'#f5c542',2:'#c8ccd4',3:'#c1662f'};
/* Ранг 1-99 показывается; 100 — граница; 101+ не отображается нигде */
function lbRank(un){ return lbTop3()[un]||0; }
function lbMark(un){
  const r=lbRank(un); if(!r||r>99) return '';
  const cls = r<=3 ? ' lb-'+r : '';
  return '<span class="lb-mark'+cls+'" style="'+(r>3?'background:#2a2a2a;color:#ccc;':'')+'" title="'+esc(t('lbPlace'))+' '+r+'">'+r+'</span>';
}

/* Короткий публичный идентификатор материала (как в адресной строке YouTube) */
function makeSlug(){
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out=''; for(let i=0;i<13;i++) out+=A[Math.floor(Math.random()*A.length)];
  return out;
}
function slugOf(it){
  if(!it) return '';
  if(!it.slug){ it.slug=makeSlug(); saveDB(); }
  return it.slug;
}
function bySlug(sl,kind){
  const pool = kind==='v'? DB.videos : DB.posts;
  return pool.find(x=>x.slug===sl)||pool.find(x=>x.id===sl)||null;
}
function parseHash(){
  // Адрес вида ?v=SLUG / ?p=SLUG имеет приоритет над hash-маршрутом
  const q=new URLSearchParams(location.search);
  if(q.get('v')) return { name:'watch', arg:q.get('v'), tab:'', bySlug:'v' };
  if(q.get('p')) return { name:'post', arg:q.get('p'), tab:'', bySlug:'p' };
  let h=location.hash.replace(/^#\/?/,'');
  if(!h) h='home';
  const p=h.split('/').filter(Boolean);
  return { name:p[0]||'home', arg:decodeURIComponent(p[1]||''), tab:p[2]||'' };
}
/* Единый переход: поддерживаются и ?v=SLUG, и #/маршрут */
function go(path,replace){
  const p=String(path);
  const url = p.charAt(0)==='?' ? location.pathname+p : location.pathname+'#/'+p.replace(/^#?\/?/,'');
  if(location.pathname+location.search+location.hash===url){ render(); return; }
  try{ replace? history.replaceState({},'',url) : history.pushState({},'',url); }
  catch(e){ location.href=url; return; }
  ROUTE=parseHash(); stopPlayer(); render(); window.scrollTo(0,0);
}

function openMenu(anchor,items,head){
  closeMenus();
  const m=document.createElement('div');
  m.className='menu';
  m.innerHTML=(head?'<div class="menu-head">'+esc(head)+'</div>':'')+
    items.map((it,i)=>'<button class="menu-item" data-i="'+i+'">'+esc(it.label)+
      (it.checked?'<span class="chk">✓</span>':'')+'</button>').join('');
  /* В полноэкранном режиме меню должно жить внутри развёрнутого элемента,
     иначе оно окажется под видео и будет невидимым */
  const fs=document.fullscreenElement;
  const host = fs || document.body;
  if(fs) m.classList.add('menu-fs');
  host.appendChild(m);
  const r=anchor.getBoundingClientRect();
  const w=m.offsetWidth,h=m.offsetHeight;
  const sx = fs?0:window.scrollX, sy = fs?0:window.scrollY;
  const hr = fs? host.getBoundingClientRect() : {left:0,top:0};
  let left=r.left+sx-(fs?hr.left:0), top=r.bottom+sy-(fs?hr.top:0)+6;
  const maxW = fs? hr.width||window.innerWidth : window.innerWidth;
  const maxH = fs? hr.height||window.innerHeight : window.innerHeight;
  if(left+w>maxW-10) left=maxW-w-10;
  if(r.bottom-(fs?hr.top:0)+h>maxH-10) top=r.top+sy-(fs?hr.top:0)-h-6;
  m.style.left=Math.max(8,left)+'px'; m.style.top=Math.max(8,top)+'px';
  $$('.menu-item',m).forEach(b=> b.onclick=ev=>{ ev.stopPropagation(); const it=items[+b.dataset.i];
    closeMenus(); if(it.fn) it.fn(); });
}

function loginRules(v){
  return [
    {key:'ruleLen',ok:v.length>=3&&v.length<=20},
    {key:'ruleChars',ok:/^[A-Za-z0-9_]*$/.test(v)&&v.length>0},
    {key:'ruleStart',ok:/^[A-Za-z]/.test(v)},
    {key:'ruleFree',ok:v.length>=3&&!DB.users.some(u=>u.username.toLowerCase()===v.toLowerCase())}
  ];
}
function passRules(v,login,strong){
  const r=[
    {key:strong?'rulePassLen10':'rulePassLen',ok:v.length>=(strong?10:8)},
    {key:'rulePassLetter',ok:/[A-Za-zА-Яа-я]/.test(v)},
    {key:'rulePassDigit',ok:/[0-9]/.test(v)},
    {key:'rulePassCase',ok:/[a-zа-я]/.test(v)&&/[A-ZА-Я]/.test(v)}
  ];
  if(strong) r.push({key:'rulePassSpec',ok:/[^A-Za-zА-Яа-я0-9]/.test(v)});
  else r.push({key:'rulePassNoLogin',ok:v.length>0&&v.toLowerCase()!==String(login||'').toLowerCase()});
  return r;
}
function renderRules(box,rules){
  box.innerHTML=rules.map(r=>'<div class="rule'+(r.ok?' ok':'')+'"><span class="mark">'+(r.ok?'✓':'•')+'</span>'+esc(t(r.key))+'</div>').join('');
  return rules.every(r=>r.ok);
}
function bindAuth(){
  const err=$('#lgErr');
  const doLogin=()=>{
    const fail=x=>{ err.textContent=x; err.classList.remove('hidden'); };
    if(Date.now()<loginLock) return fail(t('errAttempts')+' '+Math.ceil((loginLock-Date.now())/1000)+' '+t('seconds'));
    const l=$('#lgLogin').value.trim(),p=$('#lgPass').value;
    if(!l||!p) return fail(t('errEmptyLogin'));
    const u=DB.users.find(x=>x.username.toLowerCase()===l.toLowerCase());
    if(!u||u.password!==p){ loginTries++;
      if(loginTries>=5){ loginLock=Date.now()+30000; loginTries=0; } return fail(t('errCreds')); }
    if(banInfo(u)){ saveDB(); return fail(banMessage(u)); }
    loginTries=0;
    SESSION={username:u.username,at:Date.now()};
    localStorage.setItem(LS.SESSION,JSON.stringify(SESSION));
    sessionStorage.removeItem('orbit_guest');
    go('home');
  };
  $('#lgBtn').onclick=doLogin;
  $('#lgPass').onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
  const validate=()=>{
    const name=$('#rgName').value.trim(),lg=$('#rgLogin').value.trim(),pw=$('#rgPass').value,pw2=$('#rgPass2').value;
    const okL=renderRules($('#rgLoginRules'),loginRules(lg));
    const okP=renderRules($('#rgPassRules'),passRules(pw,lg,false));
    const okN=name.length>=2&&name.length<=40;
    const okP2=pw2.length>0&&pw===pw2;
    $('#rgNameErr').textContent=t('errName');
    $('#rgNameErr').classList.toggle('hidden',okN||name.length===0);
    $('#rgPass2Err').textContent=t('errPass2');
    $('#rgPass2Err').classList.toggle('hidden',okP2||pw2.length===0);
    $('#rgBtn').disabled=!(okL&&okP&&okN&&okP2&&$('#rgTerms').checked);
    return okL&&okP&&okN&&okP2&&$('#rgTerms').checked;
  };
  ['rgName','rgLogin','rgPass','rgPass2'].forEach(id=>{ $('#'+id).oninput=validate; });
  $('#rgTerms').onchange=validate;
  const doReg=()=>{
    const e2=$('#rgErr');
    if(!validate()){ if(!$('#rgTerms').checked){ e2.textContent=t('errTerms'); e2.classList.remove('hidden'); } return; }
    const lg=$('#rgLogin').value.trim();
    DB=loadDB();
    if(DB.users.some(u=>u.username.toLowerCase()===lg.toLowerCase())){
      e2.textContent=t('errTaken'); e2.classList.remove('hidden'); validate(); return; }
    const pal=['#e5e5e5','#9ec1ff','#a5e3b0','#ffd08a','#f4a9b8','#c4b5fd','#8fd6d6'];
    const name=$('#rgName').value.trim();
    DB.users.push({ id:uid('u'),username:lg,password:$('#rgPass').value,name,initials:initialsOf(name),
      color:pal[DB.users.length%pal.length],avatarKey:'',bio:'',region:$('#rgRegion').value,
      role:'user',isVerified:false,showStaff:false,banned:false,bannedUntil:0,banReason:'',
      following:[],bookmarks:[],notifications:[],createdAt:Date.now() });
    saveDB();
    SESSION={username:lg,at:Date.now()};
    localStorage.setItem(LS.SESSION,JSON.stringify(SESSION));
    sessionStorage.removeItem('orbit_guest');
    go('home'); toast(t('regOk'));
  };
  $('#rgBtn').onclick=doReg;
  $('#rgPass2').onkeydown=e=>{ if(e.key==='Enter') doReg(); };
  $('#tabLogin').onclick=()=>{ $('#tabLogin').classList.add('active'); $('#tabReg').classList.remove('active');
    $('#formLogin').classList.remove('hidden'); $('#formReg').classList.add('hidden'); };
  $('#tabReg').onclick=()=>{ $('#tabReg').classList.add('active'); $('#tabLogin').classList.remove('active');
    $('#formReg').classList.remove('hidden'); $('#formLogin').classList.add('hidden'); validate(); };
  $('#guestBtn').onclick=()=>{ sessionStorage.setItem('orbit_guest','1'); go('home'); toast(t('guestMode')); };
  bindLang();
}
function requireAuth(){
  if(me()) return true;
  confirmBox(t('needAuth'),t('guestMode'),t('goSignIn'),()=>go('auth'));
  return false;
}

function openNotifications(){
  if(!requireAuth()) return;
  const u=me(); const list=(u.notifications||[]).slice();
  const unread=list.filter(n=>!n.read).length;
  // группировка по дням делает длинный список читаемым
  const groups={};
  list.forEach(n=>{
    const d=new Date(n.createdAt);
    const today=new Date(); today.setHours(0,0,0,0);
    const key = n.createdAt>=today.getTime()? t('today')
      : (n.createdAt>=today.getTime()-86400000? t('yesterday') : fmtDate(n.createdAt));
    (groups[key]=groups[key]||[]).push(n);
  });
  const body = list.length
    ? Object.keys(groups).map(k=>'<div class="notif-group">'+esc(k)+'</div>'+
        groups[k].map(n=>'<a class="notif-item'+(n.read?'':' unread')+'"'+(n.link?' href="'+esc(n.link)+'"':'')+'>'+
          '<span class="notif-dot"></span><div style="flex:1;min-width:0">'+
          '<div style="font-size:14px;line-height:1.45">'+esc(n.text)+'</div>'+
          '<div style="color:var(--dim);font-size:12px;margin-top:3px">'+esc(timeAgo(n.createdAt))+'</div></div></a>').join('')
      ).join('')
    : '<div class="empty">'+esc(t('emptyNotif'))+'</div>';
  openModal('<div class="modal" style="max-width:480px"><div class="modal-head">'+
   '<div style="display:flex;align-items:center;gap:9px"><div class="modal-title">'+esc(t('notif'))+'</div>'+
   (unread?'<span class="badge badge-red">'+unread+'</span>':'')+'</div>'+
   '<div style="display:flex;gap:6px">'+
    (list.length?'<button class="btn btn-sm" id="notifClear">'+esc(t('clearAll'))+'</button>':'')+
    '<button class="icon-btn" onclick="closeModal()">✕</button></div></div>'+
   '<div class="modal-body" style="max-height:68vh;overflow:auto;padding:10px 12px">'+body+'</div></div>');
  $$('#modals a[href]').forEach(a=>a.onclick=()=>closeModal());
  const cl=$('#notifClear');
  if(cl) cl.onclick=()=>{ u.notifications=[]; saveDB(); closeModal(); render(); };
  (u.notifications||[]).forEach(n=>n.read=true); saveDB();
  const nb=$('#notifBtn'); if(nb){ const c=$('.counter-badge',nb); if(c) c.remove(); }
}

function tagOf(it){
  let h='';

  if(it.privacy==='private') h+='<span class="badge badge-red">'+esc(t('pubPrivate'))+'</span>';

/* Реакции обновляют только свои кнопки: плеер не перезапускается */
/* Предпросмотр при наведении: через 0.5 с включается беззвучный отрывок
   на 10 секунд, снизу идёт полоска прогресса, затем цикл повторяется. */
let PREVIEW=null;
function stopPreview(){
  if(!PREVIEW) return;
  clearTimeout(PREVIEW.delay); clearInterval(PREVIEW.tick);
  if(PREVIEW.video){ try{ PREVIEW.video.pause(); }catch(e){} PREVIEW.video.remove(); }
  if(PREVIEW.bar) PREVIEW.bar.remove();
  PREVIEW=null;
}
function bindPreviews(){
  if(!SET.preview) return;
  $$('.thumb[data-prev]').forEach(el=>{
    el.onmouseenter=()=>{
      if(ROUTE.name==='watch') return;
      stopPreview();
      const id=el.dataset.prev;
      const it=DB.videos.find(v=>v.id===id); if(!it) return;
      PREVIEW={ el, delay:setTimeout(()=>startPreview(el,it),0) };
    };
    el.onmouseleave=stopPreview;
  });
}
function startPreview(el,it){
  const src = it.fileKey? mURL(it.fileKey) : Promise.resolve(it.src||null);
  src.then(url=>{
    if(!url||!PREVIEW||PREVIEW.el!==el) return;
    const v=document.createElement('video');
    v.className='prev'; v.muted=true; v.playsInline=true; v.preload='metadata'; v.src=url;
    const bar=document.createElement('div'); bar.className='prev-bar'; bar.innerHTML='<i></i>';
    el.appendChild(v); el.appendChild(bar);
    PREVIEW.video=v; PREVIEW.bar=bar;
    const fill=bar.querySelector('i');
    let started=0;
    v.onloadedmetadata=()=>{
      // начинаем с 10% ролика, чтобы не показывать заставку
      v.currentTime=Math.min(v.duration*0.1, Math.max(0,v.duration-11));
      started=v.currentTime;
      v.play().catch(()=>{});
    };
    PREVIEW.tick=setInterval(()=>{
      if(!PREVIEW||!PREVIEW.video) return;
      const passed=v.currentTime-started;
      fill.style.width=Math.min(100,(passed/10)*100)+'%';
      if(passed>=10){                       // цикл: снова с той же точки
        v.currentTime=started; fill.style.width='0%';
      }
    },200);
  });
}
/* Крупный просмотр снимков со стрелками и клавишами */
function openLightbox(it,idx){
  const ph=it.photos||[]; if(!ph.length) return;
  let i=Math.max(0,Math.min(idx,ph.length-1));
  const wrap=document.createElement('div');
  wrap.className='lb-view';
  wrap.innerHTML='<button class="lb-nav" style="left:16px">‹</button><img alt="">'+
    '<button class="lb-nav" style="right:16px">›</button>'+
    '<div class="mono" style="position:absolute;top:18px;left:50%;transform:translateX(-50%);color:#aaa;font-size:13px"></div>'+
    '<button class="icon-btn" style="position:absolute;top:14px;right:16px;color:#fff;border-color:rgba(255,255,255,.2)">✕</button>';
  document.body.appendChild(wrap);
  const img=wrap.querySelector('img'), cnt=wrap.querySelector('.mono');
  const show=()=>{ cnt.textContent=(i+1)+' / '+ph.length;
    mURL(ph[i].key).then(u=>{ if(u) img.src=u; }); };
  const close=()=>{ wrap.remove(); document.removeEventListener('keydown',key); };
  const key=e=>{ if(e.key==='Escape') close();
    else if(e.key==='ArrowRight'){ i=(i+1)%ph.length; show(); }
    else if(e.key==='ArrowLeft'){ i=(i-1+ph.length)%ph.length; show(); } };
  wrap.querySelectorAll('.lb-nav')[0].onclick=e=>{ e.stopPropagation(); i=(i-1+ph.length)%ph.length; show(); };
  wrap.querySelectorAll('.lb-nav')[1].onclick=e=>{ e.stopPropagation(); i=(i+1)%ph.length; show(); };
  wrap.querySelector('.icon-btn').onclick=close;
  wrap.onclick=e=>{ if(e.target===wrap) close(); };
  document.addEventListener('keydown',key);
  show();
}

/* Инициализация плеера.
   Премьера живёт в трёх фазах:
   1) countdown — идёт обратный отсчёт, трейлер играет как самостоятельное видео
      со своим таймлайном и рабочей перемоткой внутри себя;
   2) live — премьера идёт синхронно для всех зрителей: назад перематывать можно,
      вперёд дальше текущей «живой» точки — нельзя;
   3) normal — обычное видео без ограничений. */
function initPlayer(it){
  const wrap=$('#plWrap'), v=$('#plVideo'), bar=$('#plBar'), fill=$('#plFill'), buf=$('#plBuf'),
        dot=$('#plDot'), lbl=$('#plTime'), pb=$('#plPlay'), poster=$('#plPoster'), hov=$('#plHover');
  if(!wrap) return;
  PL.v=v; PL.wrap=wrap; PL.item=it; PL.dur=it.durationSec||0; PL.cur=0; PL.virtual=true;
  PL.trailer=false; PL.liveMode=false; PL.locked=false;
  const I_PLAY='<svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const I_PAUSE='<svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
  const posKey='orbit_pos_'+it.id;
  const savePos=x=>{ try{ (!PL.trailer&&!PL.liveMode&&x>3&&x<PL.dur-5)? localStorage.setItem(posKey,String(Math.floor(x)))
    : localStorage.removeItem(posKey); }catch(e){} };
  function chapAt(sec){ let cur=null; (it.chapters||[]).forEach(c=>{ if(c.at<=sec) cur=c; }); return cur; }
  /* Верхняя граница перемотки: в эфире премьеры — текущая живая точка */
  function maxSeek(){ return PL.liveMode? Math.min(PL.dur,liveEdge(it)) : PL.dur; }
  /* В эфире премьеры разрешено отставать не более чем на 10 секунд */
  const PREM_BACK=10;
  function minSeek(){ return PL.liveMode? Math.max(0,maxSeek()-PREM_BACK) : 0; }
  function ui(){
    const p=PL.dur?Math.min(100,(PL.cur/PL.dur)*100):0;
    fill.style.width=p+'%'; dot.style.left=p+'%';
    lbl.textContent=fmtTime(PL.cur)+' / '+fmtTime(PL.dur);
    pb.innerHTML=PL.playing?I_PAUSE:I_PLAY;
    const cn=$('#plChapNow');
    if(cn){ const c=PL.trailer?null:chapAt(PL.cur); cn.textContent=c?c.title:''; }
    if(PL.liveMode){
      // «живая» часть шкалы: всё, что правее текущей точки эфира, помечено как недоступное
      const le=Math.min(100,(maxSeek()/PL.dur)*100);
      buf.style.width=le+'%';
      const pill=$('#plLive'), gap=maxSeek()-PL.cur;
      if(pill){ pill.classList.toggle('behind',gap>3);
        $('#plLiveTxt').textContent = gap>3? (t('behind')+' '+fmtTime(gap)) : t('liveEdge'); }
    } else {
      try{ if(v.buffered&&v.buffered.length&&PL.dur)
        buf.style.width=Math.min(100,(v.buffered.end(v.buffered.length-1)/PL.dur)*100)+'%'; }catch(e){}
    }
  }
  PL.ui=ui;
  function flash(html){
    const c=$('#plCenter'); if(!c) return;
    c.innerHTML=html; c.classList.remove('hidden','go');
    void c.offsetWidth; c.classList.add('go');
    clearTimeout(c._t); c._t=setTimeout(()=>c.classList.add('hidden'),520);
  }
  function play(){
    PL.playing=true;
    if(!PL.virtual) v.play().catch(()=>{ PL.virtual=true; });
    if(PL.tick) clearInterval(PL.tick);
    PL.tick=setInterval(()=>{
      if(!PL.playing) return;
      if(PL.virtual){ PL.cur+=0.25*(v.playbackRate||1); if(PL.cur>=PL.dur){ PL.cur=PL.dur; ended(); } }
      if(PL.liveMode){
        // держим зрителя в окне: не дальше живой точки и не более 10 секунд позади
        const le=maxSeek(), lo=minSeek();
        if(PL.cur>le+0.4){ PL.cur=le; if(!PL.virtual) v.currentTime=le; }
        else if(PL.cur<lo-0.4){ PL.cur=lo; if(!PL.virtual) v.currentTime=lo; }
      }
      ui();
    },250);
    ui();
  }
  function pause(){ PL.playing=false; if(!PL.virtual){ try{v.pause();}catch(e){} } ui(); }
  PL.play=play; PL.pause=pause;
  function ended(){
    if(PL.trailer){ v.currentTime=0; v.play().catch(()=>{}); return; }   // трейлер идёт по кругу
    PL.playing=false; ui();
    if(PL.tick){ clearInterval(PL.tick); PL.tick=null; }
    savePos(0);
    showEndScreen(it);
  }
  function showEndScreen(it){
    const u2=me();
    // Экран после окончания: рекомендации автора (если есть) + автовоспроизведение
    const recs = (it.endRecs||[]).slice(0,3).map(id=>DB.videos.find(v2=>v2.id===id)||bySlug(id,'v')).filter(Boolean);
    const nextAutoList = DB.videos.filter(isLive).sort((a2,b2)=>b2.createdAt-a2.createdAt);
    const nextIdx = nextAutoList.findIndex(x=>x.id===it.id);
    const nextAuto = nextAutoList[(nextIdx+1)%nextAutoList.length];
    const hasNext = SET.autoplay&&!PL.liveMode&&nextAuto&&nextAuto.id!==it.id;
    // Строим экран поверх плеера
    const es=document.createElement('div');
    es.id='endScreen';
    es.style.cssText='position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;animation:fade .2s ease';
    // Блок рекомендаций автора (до 3 видео)
    let recsHTML='';
    if(recs.length){
      recsHTML='<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:640px">';
      // Первое — крупнее (верхнее, на всю ширину если одно, иначе пополам)
      recs.forEach((rv,ri)=>{
        const d2=abData(rv);
        const isFirst=ri===0;
        recsHTML+='<a href="'+linkOf(rv)+'" style="flex:'+(recs.length===1?'0 0 320px':'0 0 '+( isFirst&&recs.length>1?'100%':'calc(50% - 6px)'))+';'+
          'background:#111;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden;text-decoration:none;transition:border-color .15s" '+
          'onmouseover="this.style.borderColor=\'#4a4a4a\'" onmouseout="this.style.borderColor=\'#2a2a2a\'">'+
          '<div style="position:relative;aspect-ratio:16/9;background:#181818;overflow:hidden">'+
          (d2.coverKey?'<div data-cov="'+esc(d2.coverKey)+'" style="position:absolute;inset:0"></div>':
           d2.cover?'<img src="'+esc(d2.cover)+'" style="width:100%;height:100%;object-fit:cover" alt="">':
           '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#555;font-size:13px">'+esc(d2.title)+'</div>')+
          '<span style="position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.85);padding:2px 5px;border-radius:4px;font-family:var(--mono);font-size:11px;color:#fff">'+esc(fmtTime(rv.durationSec))+'</span>'+
          '</div>'+
          '<div style="padding:10px 12px 12px"><div style="font-size:13.5px;font-weight:700;line-height:1.3;color:#ededed">'+esc(d2.title)+'</div>'+
          '<div style="font-size:12px;color:#666;margin-top:4px">'+esc(fmtNum(rv.views||0)+' '+t('views'))+'</div></div></a>';
      });
      recsHTML+='</div>';
    }
    // Кнопка автовоспроизведения с таймером
    let autoHTML='';
    if(hasNext){
      autoHTML='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center">'+
        '<span style="color:#aaa;font-size:14px">'+(LANG==='ru'?'Начнётся через':'Starting in')+'</span>'+
        '<span id="esCountdown" style="font-size:22px;font-weight:800;font-family:var(--mono);color:#fff;min-width:26px;text-align:center">3</span>'+
        '<a href="'+linkOf(nextAuto)+'" id="esNextLink" style="display:flex;align-items:center;gap:8px;background:#fff;color:#0a0a0a;'+
        'padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none">'+
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'+
        esc(String(nextAuto.title).slice(0,40))+'</a>'+
        '<button id="esCancelBtn" style="background:transparent;border:1px solid #3a3a3a;color:#aaa;border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer">'+
        (LANG==='ru'?'Отмена':'Cancel')+'</button></div>';
    }
    es.innerHTML=(recsHTML||'')+autoHTML+
      '<button id="esReplay" style="background:transparent;border:1px solid #2a2a2a;color:#888;border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer">'+
      (LANG==='ru'?'↺ Повторить':'↺ Replay')+'</button>';
    wrap.appendChild(es);
    // Загружаем обложки рекомендаций
    es.querySelectorAll('[data-cov]').forEach(el=>{ mURL(el.dataset.cov).then(u3=>{ if(u3){
      const img=document.createElement('img'); img.src=u3; img.alt=''; img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
      el.appendChild(img); } }); });
    // Таймер автовоспроизведения
    if(hasNext){
      let cnt=3;
      const cd=es.querySelector('#esCountdown');
      const timer=setInterval(()=>{
        cnt--;
        if(cd) cd.textContent=cnt;
        if(cnt<=0){ clearInterval(timer); if(document.getElementById('endScreen')) go(linkOf(nextAuto)); }
      },1000);
      const cancelBtn=es.querySelector('#esCancelBtn');
      if(cancelBtn) cancelBtn.onclick=()=>{ clearInterval(timer); es.remove(); };
    }
    const replay=es.querySelector('#esReplay');
    if(replay) replay.onclick=()=>{ es.remove(); PL.cur=0; if(!PL.virtual) v.currentTime=0; play(); };
    // Клик по ссылке — убираем экран перед переходом
    es.querySelectorAll('a[href]').forEach(a=>a.onclick=()=>es.remove());
  }
  /* Подключение источника. mode: 'trailer' | 'main' | 'live' */
  function attach(url,mode){
    PL.trailer = mode==='trailer';
    PL.liveMode = mode==='live';
    $('#plTrailerTag').classList.toggle('hidden',!PL.trailer);
    $('#plLive').classList.toggle('hidden',!PL.liveMode);
    bar.classList.remove('locked');
    v.src=url; v.volume=SET.volume; v.loop=PL.trailer;
    v.playbackRate = PL.liveMode ? 1 : SET.speed;   // в эфире премьеры темп общий для всех
    const sp=$('#plSpeed');
    if(sp){ sp.textContent = PL.liveMode? '1×' : (SET.speed===1?'1×':SET.speed+'×');
      sp.style.opacity = PL.liveMode? '.55':'1'; }
    v.onloadedmetadata=()=>{
      PL.virtual=false;
      // у трейлера собственная длительность и собственный таймлайн
      PL.dur = PL.trailer ? (v.duration||0) : (v.duration||it.durationSec);
      v.style.display='block'; poster.style.display='none';
      applyQuality(SET.quality);
      if(PL.liveMode){
        const le=Math.min(PL.dur,liveEdge(it));
        v.currentTime=le; PL.cur=le;                    // подключаемся к текущей точке эфира
      } else if(!PL.trailer){
        let saved=0; try{ saved=parseInt(localStorage.getItem(posKey)||'0',10); }catch(e){}
        if(saved>0&&saved<PL.dur-5){ v.currentTime=saved; PL.cur=saved; flash(t('resumed')+' '+fmtTime(saved)); }
      }
      ui(); if(!PL.trailer) chapterMarkers(it); play();
    };
    v.onerror=()=>{ PL.virtual=true; v.style.display='none'; poster.style.display='flex'; };
    v.ontimeupdate=()=>{ if(!PL.virtual){ PL.cur=v.currentTime; ui();
      if(!PL.trailer&&!PL.liveMode&&Math.floor(PL.cur)%5===0) savePos(PL.cur); } };
    v.onended=ended;
    v.onprogress=ui;
    v.onwaiting=()=>flash('<span class="spinner"></span>');
  }
  const mainSrc=()=> it.fileKey? mURL(it.fileKey) : Promise.resolve(it.src||null);
  function startLive(){
    $('#plNoTrailer').classList.add('hidden');
    $('#plPremBar').classList.add('hidden');
    mainSrc().then(u=>{ if(u) attach(u,'live'); else { PL.liveMode=true; PL.dur=it.durationSec;
      PL.cur=Math.min(PL.dur,liveEdge(it)); $('#plLive').classList.remove('hidden'); ui(); play(); } });
  }
  function startNormal(){
    it.premiere=false; saveDB();                        // премьера отыграла — статус снимается
    $('#plNoTrailer').classList.add('hidden'); $('#plPremBar').classList.add('hidden');
    $('#plLive').classList.add('hidden');
    mainSrc().then(u=>{ if(u) attach(u,'main'); else { PL.dur=it.durationSec; ui(); play(); } });
  }
  const phase=premPhase(it);
  if(phase==='countdown'){
    PL.locked=true;
    if(it.trailerKey) mURL(it.trailerKey).then(u=>{ if(u) attach(u,'trailer'); else $('#plNoTrailer').classList.remove('hidden'); });
    else $('#plNoTrailer').classList.remove('hidden');
  } else if(phase==='live'){ startLive(); }
  else { startNormal(); }
  if(it.coverKey) mURL(it.coverKey).then(u=>{ if(u&&poster) poster.innerHTML='<img src="'+u+'" style="width:100%;height:100%;object-fit:cover" alt="">'; });

  const toggle=()=>{ if(PL.playing){ pause(); flash(I_PAUSE); } else { play(); flash(I_PLAY); } };
  pb.onclick=toggle;
  /* Перемотка. Вперёд закрыта только в эфире премьеры, назад доступна всегда. */
  function seekTo(sec,quiet){
    const lim=maxSeek(), low=minSeek();
    if(sec>lim+0.3){
      if(!quiet) toast(PL.liveMode? t('noSeekFwd') : t('lockedSeek'));
      sec=lim;
    }
    if(sec<low-0.3){
      if(!quiet) toast(t('noSeekBack'));
      sec=low;
    }
    PL.cur=Math.max(low,Math.min(PL.dur,sec));
    if(!PL.virtual) v.currentTime=PL.cur;
    ui();
  }
  const seek=d=>{
    if(PL.liveMode&&d>0&&PL.cur>=maxSeek()-0.5){ toast(t('noSeekFwd')); return; }
    seekTo(PL.cur+d,true);
    flash('<span class="mono" style="font-size:16px">'+(d>0?'+':'')+d+'s</span>');
  };
  $('#plBack').onclick=()=>seek(-10);
  $('#plFwd').onclick=()=>seek(10);
  const posOf=e=>{ const r=bar.getBoundingClientRect(); return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); };
  bar.onclick=e=>{
    if(PL.locked&&!PL.trailer){ toast(t('lockedSeek')); return; }  // трейлер перематывается свободно
    seekTo(posOf(e)*PL.dur);
  };
  bar.onmousemove=e=>{
    if(!hov||!PL.dur) return;
    const p=posOf(e); hov.style.left=(p*100)+'%';
    const sec=p*PL.dur, c=PL.trailer?null:chapAt(sec);
    hov.textContent=fmtTime(sec)+(c?' · '+c.title:'')+(PL.liveMode&&sec>maxSeek()?' · '+t('noSeekFwd'):'');
    hov.style.opacity='1';
  };
  bar.onmouseleave=()=>{ if(hov) hov.style.opacity='0'; };
  const pill=$('#plLive');
  if(pill) pill.onclick=()=>{ seekTo(maxSeek(),true); play(); flash('<span class="mono" style="font-size:14px">LIVE</span>'); };
  const vol=$('#plVol');
  const paintVol=()=>{ vol.style.setProperty('--fill',(v.muted?0:Math.round(SET.volume*100))+'%');
    const n=$('#plVolNum'); if(n) n.textContent=v.muted?0:Math.round(SET.volume*100); };
  vol.oninput=e=>{ SET.volume=e.target.value/100; v.volume=SET.volume; v.muted=SET.volume===0; saveSet(); paintVol(); };
  paintVol();
  $('#plMute').onclick=()=>{ v.muted=!v.muted; $('#plMute').style.opacity=v.muted?'.5':'1'; paintVol();
    flash('<span class="mono" style="font-size:15px">'+(v.muted?'0%':Math.round(SET.volume*100)+'%')+'</span>'); };
  $('#plSpeed').onclick=e=>{
    if(PL.liveMode){ toast(t('speedLocked')); return; }
    openMenu(e.currentTarget,speedList().map(sp=>({label:(sp===1?t('normal'):sp+'×'),checked:SET.speed===sp,
      fn:()=>{ SET.speed=sp; saveSet(); v.playbackRate=sp; $('#plSpeed').textContent=(sp===1?'1×':sp+'×'); }})),
      t('speed')+(level(me())>=2?' · '+t('speedPro'):''));
  };
  $('#plTheater').onclick=()=>{ SET.theater=!SET.theater; saveSet(); document.body.classList.toggle('theater',SET.theater); };
  if(SET.theater) document.body.classList.add('theater');
  $('#plPip').onclick=()=>{ try{ document.pictureInPictureElement? document.exitPictureInPicture()
    : (v.requestPictureInPicture&&v.requestPictureInPicture()); }catch(e){} };
  $('#plFs').onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen();
    else if(wrap.requestFullscreen) wrap.requestFullscreen(); };
  const idle=()=>{ wrap.classList.remove('idle'); if(PL.idleTm) clearTimeout(PL.idleTm);
    PL.idleTm=setTimeout(()=>{ if(PL.playing) wrap.classList.add('idle'); },2600); };
  wrap.onmousemove=idle;
  wrap.onclick=e=>{ if(e.target===v||e.target===poster) toggle(); idle(); };
  wrap.ondblclick=e=>{ if(e.target===v) $('#plFs').click(); };
  PL.keys=e=>{
    if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const k=e.key.toLowerCase();
    if(k===' '||k==='k'){ e.preventDefault(); toggle(); }
    else if(k==='arrowright'||k==='l') seek(10);
    else if(k==='arrowleft'||k==='j') seek(-10);
    else if(k==='f') $('#plFs').click();
    else if(k==='m') $('#plMute').click();
    else if(k==='t') $('#plTheater').click();
    else if(k==='p') $('#plPip').click();
    else if(k==='arrowup'){ e.preventDefault(); vol.value=Math.min(100,+vol.value+5); vol.oninput({target:vol}); }
    else if(k==='arrowdown'){ e.preventDefault(); vol.value=Math.max(0,+vol.value-5); vol.oninput({target:vol}); }
    else if(/^[0-9]$/.test(k)&&(!PL.locked||PL.trailer)) seekTo(PL.dur*(+k/10));
  };
  document.addEventListener('keydown',PL.keys);
  idle(); ui();
  $('#plSpeed').textContent = SET.speed===1?'1×':SET.speed+'×';

  if(phase==='countdown'){
    const barP=$('#plPremBar'); barP.classList.remove('hidden');
    $('#plPremAt').textContent=fmtDT(it.premiereAt);
    const step=()=>{
      const left=it.premiereAt-Date.now();
      if(left<=0){
        clearInterval(PL.prem); PL.prem=null;
        PL.locked=false;
        $('#plTrailerTag').classList.add('hidden');
        toast(t('premiereStarted'));
        startLive();                                  // трейлер сменяется самой премьерой
        return;
      }
      const txt=fmtCountdown(left);
      $('#plClock').textContent=txt;
      const c2=$('#plClock2'); if(c2) c2.textContent=txt;
    };
    step(); PL.prem=setInterval(step,1000);
  } else if(phase==='live'){
    // следим за окончанием эфирного окна
    PL.prem=setInterval(()=>{
      if(premPhase(it)!=='live'){ clearInterval(PL.prem); PL.prem=null;
        PL.liveMode=false; $('#plLive').classList.add('hidden'); it.premiere=false; saveDB(); ui(); }
      else ui();
    },1000);
  }
}

function restrictPlate(it){
  const r=itemRestricted(it); if(!r) return '';
  const chan=r.kind==='channel';
  return '<div class="plate"><div style="font-weight:700;margin-bottom:5px">'+esc(chan?t('chRestricted'):t('restricted'))+'</div>'+
   '<div style="color:var(--muted);font-size:13.5px">'+esc(t('banReason'))+': '+esc(r.reason||'—')+'</div>'+
   '<div style="color:var(--dim);font-size:12.5px;margin-top:4px" class="mono">'+
     (r.until? esc(t('restrictedUntil'))+' '+esc(fmtDT(r.until)) : esc(t('restrictedPerm')))+'</div></div>';
}
function watchPage(id){
  const it=(ROUTE.bySlug==='v'? bySlug(id,'v') : DB.videos.find(v=>v.id===id)||bySlug(id,'v'));
  const u=me();
  if(!it||!canSee(it,u)) return '<div class="empty">'+esc(t('notFound'))+'</div>';
  const a=userBy(it.author); if(!a) return '<div class="empty">'+esc(t('notFound'))+'</div>';
  const following=u&&(u.following||[]).includes(a.username);
  const locked=premPhase(it)==='countdown';
  const meta=[fmtNum(it.views||0)+' '+t('views'), fmtDate(it.createdAt)];
  if(it.category&&it.category!=='none') meta.push(catName(it.category));
  const ab=abData(it);
  const nextUp=DB.videos.filter(v=>isLive(v)&&v.id!==it.id)
    .sort((a2,b2)=>{
      const sameA=(a2.author===it.author?1:0)-(b2.author===it.author?1:0);
      if(sameA) return -sameA;
      const tagScore=x=>(x.tags||[]).filter(g=>(it.tags||[]).includes(g)).length;
      return (tagScore(b2)-tagScore(a2))||((b2.views||0)-(a2.views||0));
    }).slice(0,6);
  const nextBox = nextUp.length? '<div class="card" style="padding:14px"><div style="font-weight:700;margin-bottom:10px">'+
    esc(t('nextUp'))+'</div><div style="display:flex;flex-direction:column;gap:10px">'+
    nextUp.map(v=>{ const d2=abData(v);
      return '<a href="'+linkOf(v)+'" style="display:flex;gap:10px;align-items:flex-start">'+
      '<div style="width:96px;height:54px;border-radius:7px;background:#181818;border:1px solid var(--line);flex:0 0 auto;overflow:hidden;position:relative"'+
      (d2.coverKey?' data-cov="'+esc(d2.coverKey)+'"':'')+'></div>'+
      '<div style="min-width:0"><div style="font-size:13.5px;font-weight:600" class="line-clamp2">'+esc(d2.title)+'</div>'+
      '<div class="mono" style="color:var(--dim);font-size:11.5px;margin-top:3px">'+fmtNum(v.views||0)+' '+esc(t('views'))+
      ' · '+esc(fmtTime(v.durationSec))+'</div></div></a>'; }).join('')+'</div></div>' : '';
  // Во время отсчёта премьеры играет трейлер — эпизоды основного ролика не показываем
  const inPrem = premPhase(it)!=='normal';
  const side = inPrem
    ? premChatHTML(it)
    : (chaptersHTML(it)+nextBox);
  return (it.author===(u&&u.username)||u&&u.role==='admin'?restrictPlate(it):'')+
   '<div style="display:grid;grid-template-columns:minmax(0,1fr)'+(side?' 370px':'')+';gap:20px" id="watchGrid"><div>'+
   playerHTML(it,locked)+
   '<h1 class="h1" style="margin-top:16px;font-size:21px">'+esc(ab.title||it.title)+'</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px">'+tagOf(it)+
     '<span class="mono" style="color:var(--dim);font-size:13px">'+esc(meta.join(' · '))+'</span>'+
     (it.resolution?'<span class="badge">'+esc(it.resolution)+'</span>':'')+'</div>'+
   '<div class="watch-head">'+
     avatarHTML(a,44)+'<div style="flex:1;min-width:140px">'+nameHTML(a)+
     '<div class="mono" style="color:var(--dim);font-size:12.5px">'+followersOf(a.username)+' '+esc(t('subsCnt'))+'</div></div>'+
     (u&&u.username===a.username?'':'<button class="btn '+(following?'':'btn-primary')+' btn-sm" id="followBtn" data-user="'+esc(a.username)+'">'+
       esc(following?t('unsubscribe'):t('subscribe'))+'</button>')+'</div>'+
   '<div style="margin-top:14px">'+actionsHTML(it,true)+'</div>'+
   ((it.tags||[]).length?'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">'+
     it.tags.map(x=>'<a class="chip" href="#/search/'+encodeURIComponent(x)+'">#'+esc(x)+'</a>').join('')+'</div>':'')+
   (it.desc?'<div class="card desc-box" id="descBox" style="padding:14px;margin-top:14px;cursor:pointer">'+
     '<div class="pre-wrap desc-text" style="font-size:14.5px;line-height:1.62">'+richText(it.desc)+'</div>'+
     '<div class="desc-more" style="color:var(--muted);font-size:13px;font-weight:600;margin-top:8px">'+esc(t('showMore'))+'</div></div>':'')+
   (canEditMeta(it)?'<div style="margin-top:14px"><button class="btn btn-sm" id="editMeta">'+esc(t('aEdit'))+'</button>'+
     '<span class="hint" style="display:inline-block;margin-left:10px">'+esc(t('editWindow'))+': '+
     (EDIT_DAYS(u)===Infinity?'∞':EDIT_DAYS(u)+' '+t('dShort'))+'</span></div>':'')+
   commentsBlock(it)+'</div>'+(side?'<aside><div style="position:sticky;top:80px;display:flex;flex-direction:column;gap:14px">'+side+'</div></aside>':'')+'</div>';
}

/* ==================================================================
   ЧАТ ПРЕМЬЕРЫ — живое обсуждение во время отсчёта и эфира
   ================================================================== */
function premChatHTML(it){
  const u=me();
  const msgs=DB.premchat.filter(m=>m.item===it.id).sort((a,b)=>a.at-b.at).slice(-120);
  const can = !!u && canComment(it,u).ok;
  return '<div class="card" style="padding:0;display:flex;flex-direction:column;height:min(72vh,620px)">'+
   '<div style="padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px">'+
     '<span class="live-dot"></span><span style="font-weight:700">'+esc(t('premChat'))+'</span>'+
     '<span class="mono" style="color:var(--dim);font-size:12px;margin-left:auto">'+msgs.length+'</span></div>'+
   '<div id="premChatBox" style="flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px">'+
     (msgs.length? msgs.map(m=>{
       const mu=userBy(m.user); if(!mu) return '';
       const r=lbRank(m.user);
       return '<div class="pchat-msg"><span class="js-goch pchat-user'+(r?' lb-name-'+r:'')+'" data-user="'+esc(m.user)+'">'+

function viewerId(){

function abVariant(it){
  const n=Math.max(1,(it.variants||[]).length);
  if(n<=1) return 0;
  return keyHash(viewerId()+'|'+it.id)%n;
}
function abData(it){
  const i=abVariant(it);
  const v=(it.variants||[])[i];
  return { i, title: (v&&v.title)||it.title, cover:(v&&v.cover)||it.cover, coverKey:(v&&v.coverKey)||it.coverKey };
}
function abTrack(it,kind){
  if(!(it.variants||[]).length) return;
  const i=abVariant(it);
  it.abStats=it.abStats||{};
  it.abStats[i]=it.abStats[i]||{imp:0,clk:0};
  it.abStats[i][kind]++;
}

function parseChapters(raw,dur){
  // Формат строки: "0:00 Вступление" по одной главе в строке
  const out=[];
  String(raw||'').split(/\n+/).forEach(line=>{
    const m=line.trim().match(/^(\d{1,2}:)?(\d{1,2}):(\d{2})\s+(.{1,80})$/);
    if(!m) return;
    const h=parseInt((m[1]||'0').replace(':',''),10)||0;
    const sec=h*3600+parseInt(m[2],10)*60+parseInt(m[3],10);
    if(dur&&sec>dur) return;
    out.push({at:sec,title:m[4].trim()});
  });
  out.sort((a,b)=>a.at-b.at);
  return out.filter((c,i,arr)=>i===0||c.at!==arr[i-1].at);
}
function chaptersHTML(it){

function chapterMarkers(it){
  const bar=$('#plBar'); if(!bar) return;
  $$('.chmark',bar).forEach(x=>x.remove());
  if(PL.trailer||!(it.chapters||[]).length||!PL.dur) return;   // у трейлера свои границы
  it.chapters.forEach(c=>{
    if(c.at<=0||c.at>=PL.dur) return;
    const d=document.createElement('i');
    d.className='chmark';
    d.style.cssText='position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.75);left:'+((c.at/PL.dur)*100)+'%;pointer-events:none';
    bar.appendChild(d);
  });
}

   (lvl>=2?'<div style="margin-top:14px"><label class="label">'+esc(t('tags'))+'</label>'+

   /* обложки: A/B только со 2-го уровня */

   /* премьера и трейлер */
   '<div style="margin-top:20px;border:1px solid var(--line);border-radius:12px;padding:16px'+(lvl>=2?'':';opacity:.55')+'">'+

       :'<span class="badge badge-red">'+esc(t('notTrusted'))+'</span>')+'</label>'+

     '<div id="pmInBox"><label class="label">'+esc(t('minutes'))+'</label>'+
      '<input id="vPremMin" class="input mono" type="number" min="1" max="'+(lvl>=3?5256000:1440)+'" value="5"></div>'+

      '<input id="vPremAt" class="input" type="datetime-local"></div>'+
